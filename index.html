        />
      </div>
      <div className="bg-emerald-50 border border-emerald-200 rounded-lg px-4 py-2.5 text-xs text-emerald-800 mb-4">
        Click any tag to copy. Tags go in the <strong>lyrics field</strong> on separate lines.
      </div>
      {Object.entries(TAGS).map(([cat, tags]) => {
        const ft = tags.filter(t => !q || t.toLowerCase().includes(q) || cat.toLowerCase().includes(q));
        if (!ft.length) return null;
        return (
          <div key={cat} className="mb-4">
            <div className="text-[10px] font-bold text-amber-600 uppercase tracking-wide mb-2">{cat} ({ft.length})</div>
            <div className="flex flex-wrap gap-1.5">
              {ft.map(tag => (
                <button
                  key={tag}
                  onClick={() => copyTag(tag)}
                  className={`px-2.5 py-1 text-xs rounded-full border transition-all duration-150 ${
                    flashedTag === tag
                      ? 'bg-amber-50 border-amber-300 text-amber-700'
                      : 'bg-slate-100 border-transparent text-slate-700 hover:border-amber-300 hover:bg-amber-50 hover:text-amber-700'
                  }`}
                >
                  {flashedTag === tag ? '\u2713 ' + tag : tag}
                </button>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );
};

## The Two-Field System

Suno V5.5 uses two separate input fields. Putting the wrong content in the wrong field is the #1 beginner mistake.

## V5.5 Features

### Voices (Voice Cloning)

- Available on Pro and Premier plans
- Upload a clean vocal sample (minimum 10 seconds, recommended 30-60 seconds)

**Voice Cloning Masterclass:**

1. **Source recording:** Record in a DAW (not phone). 44.1kHz/24-bit WAV. Dry signal — no reverb, no compression, no effects. Room as dead as possible.
2. **Separate clones per register:** Create individual voice profiles for chest voice, head voice, and falsetto. The model handles range transitions poorly with a single clone.
3. **Sing a verification phrase:** Before using a clone in production, generate a short test with the phrase "la la la, do re mi, one two three" to verify tonal accuracy and articulation.

- Train Suno on your own music (up to 3 custom models)

- Best for artists building a consistent catalogue

### My Taste

- Suno learns your preferences over time based on likes/dislikes
- Rate generations (thumbs up/down) to train the recommendation engine
- Affects the "Create" tab suggestions
- Does NOT affect Custom Mode output — only automatic generation

### Covers Mode

- Upload any track and Suno re-records it in V5.5 quality
- Uses "Use Style and Lyrics" to extract both from the upload
- Always verify the model is set to V5.5 (it sometimes defaults to V4)
- Slider presets determine how faithful vs. transformed the output is

### Studio Editor

- Post-generation editing inside Suno's web interface
- **Editor tab:** Modify lyrics after generation — Suno re-renders the vocal with new words
- **Studio tab:** Adjust instrument levels, mute/solo elements
- **Extend:** Add bars to the end of a generation (for intros/outros)
- Limitation: Studio stems are capped at 16kHz sample rate — do NOT use for final stems

### Chat Mode

- Natural language interface for generation
- Describe what you want conversationally: "Make me a deep house track with a female vocal about summer nights"
- Suno translates your description into style + lyrics internally
- Good for ideation, bad for precision — always switch to Custom Mode for final renders

---

## Structure Tags Reference (Lyrics Field)

All metatags use square brackets. Parenthetical cues describe energy/mood to guide the AI without becoming literal lyrics.

### Primary Structure Tags

| Tag | Function | Notes |
|-----|----------|-------|
| \\\`[Intro]\\\` | Opening section | Keep sparse — drums, atmosphere |
| \\\`[Verse 1]\\\` / \\\`[Verse 2]\\\` | Main lyrical sections | Numbered for distinct content |
| \\\`[Pre-Chorus]\\\` | Tension before chorus/drop | Energy should rise |
| \\\`[Chorus]\\\` | Main hook section | Repetition works well |
| \\\`[Drop]\\\` | Peak energy moment | Critical for house — the AI unleashes here |
| \\\`[Build]\\\` / \\\`[Build-up]\\\` | Rising tension before drop | Snare rolls, risers, filter opening |
| \\\`[Breakdown]\\\` | Drums removed, space created | Pads, vocal moment, emotion |
| \\\`[Bridge]\\\` | Contrasting section | Key change or new melody |
| \\\`[Outro]\\\` | Closing section | Drums only for DJ-friendly endings |
| \\\`[Instrumental]\\\` | No vocals section | Synth solos, melodic hooks |
| \\\`[Instrumental Hook]\\\` | Catchy instrumental melody | No singing, just melody |

### Vocal Style Tags

| Tag | Effect |
|-----|--------|
| \\\`[Female Vocals]\\\` | Female voice |
| \\\`[Male Vocals]\\\` | Male voice |
| \\\`[Diva Vocals]\\\` | Powerful, soulful delivery |
| \\\`[Chopped Vocals]\\\` | Stutter/chop effect |
| \\\`[Whisper]\\\` | Intimate, breathy delivery |
| \\\`[Spoken Word]\\\` | Spoken, not sung |
| \\\`[Processed Vocals]\\\` | Vocoder/autotune effect |
| \\\`[Rap]\\\` | Rap delivery |
| \\\`[Ad-lib]\\\` | Background vocal ad-libs |

### Energy Cues (in parentheses)

These go between structure tags and lyrics. They guide the AI's energy arc.

\\\`\\\`\\\`
[Build]
(Energy rising, snare roll intensifying, filter opening)

[Drop]
(Maximum energy, heavy bass, kick drum returns)
Move your body to the sound...
\\\`\\\`\\\`

Useful cues: \\\`(energy rising)\\\`, \\\`(tension building)\\\`, \\\`(drums cut out)\\\`, \\\`(bass enters)\\\`, \\\`(full energy)\\\`, \\\`(fading out)\\\`, \\\`(atmospheric, spacious)\\\`, \\\`(rhythmic percussion start)\\\`, \\\`(rapid rise)\\\`, \\\`(minimal, stripped-back)\\\`

---

## Negative Prompting

V5.5 supports negative prompting to exclude unwanted elements.

### In the Style Field

Add exclusions with "no" prefix:
- \\\`no guitar\\\` — prevents acoustic/electric guitar
- \\\`no saxophone\\\` — prevents sax solos
- \\\`no orchestral\\\` — prevents string sections
- \\\`no autotune\\\` — prevents vocal processing
- \\\`no rap\\\` — prevents rap delivery

### In the Lyrics Field

- \\\`[No Vocals]\\\` — suppresses vocal generation
- \\\`[Instrumental Only]\\\` — reinforces instrumental mode
- \\\`[No Drums]\\\` — mutes percussion (useful for breakdowns)

### Common Negative Prompts for House

\\\`\\\`\\\`
Style: Tech House, 126 bpm, punchy kick, rolling bassline, no guitar, no orchestral, no jazz
\\\`\\\`\\\`

Limit negative prompts to 2-3 per generation. Too many confuse the model.

---

## Troubleshooting

### Weak Drops

| Symptom | Cause | Fix |
|---------|-------|-----|
| Drop lacks energy | No \\\`[Build]\\\` before \\\`[Drop]\\\` | Always place \\\`[Build]\\\` with rising energy cue directly before \\\`[Drop]\\\` |
| Drop sounds flat | Generic drop tag | Add adjectives: \\\`[Heavy Drop]\\\`, \\\`[Bass Drop]\\\`, \\\`[Explosive Drop]\\\` |
| Drop has wrong elements | Style prompt too vague | Front-load genre and specify kick/bass character in style field |
| Drop is too short | Lyrics too dense after drop | Leave only 1-2 short lyric lines after \\\`[Drop]\\\`, or use \\\`[Instrumental Hook]\\\` |

### Genre Drift

| Symptom | Cause | Fix |
|---------|-------|-----|
| Track switches genre mid-song | Too many genres in style field | Max 2 genre descriptors. Reduce to 1 if drift persists |
| EDM/pop elements creeping in | Generic descriptors like "dance" or "electronic" | Be specific: "Tech House" not "EDM" |
| Tempo wandering | BPM not specified or buried | Put BPM in position 2 of style prompt, immediately after genre |
| Style breaks after extend | Extension lost context | Copy the EXACT style prompt from the original generation |

### Vocal Hallucinations

| Symptom | Cause | Fix |
|---------|-------|-----|
| Voices in instrumental mode | Model bleeding vocal data | Add \\\`[No Vocals]\\\` + \\\`[Instrumental Only]\\\` in lyrics field AND "no vocals" in style field |
| Gibberish words | Lyrics too sparse | Fill lyrics field with structure tags and energy cues so the model has guidance |
| Wrong language | Ambiguous style keywords | Add explicit language: "English vocals" in style field |
| Vocal appears in wrong section | Lyrics misaligned with tags | Ensure each lyrics block sits directly under its structure tag |

### Lyric Bleed

| Symptom | Cause | Fix |
|---------|-------|-----|
| Lyrics from verse appear in chorus | Sections not clearly delineated | Add blank lines between sections. Use distinct structure tags |
| Rap flow instead of house phrasing | Too many words per line | Keep 4-8 words per line. Use \\\`...\\\` for pauses |
| Spoken words during instrumental | Leftover text in lyrics field | Replace words with \\\`(instrumental)\\\` cue |

---

## Phonetic Tricks

V5.5 responds to phonetic spelling in the lyrics field, which forces specific vocal delivery.

| Trick | Spelling | Effect | Best For |
|-------|----------|--------|----------|
| Jamaican water | \\\`wata\\\` | Jamaican patois pronunciation | Dancehall-house fusion |
| Held note | \\\`na ami\\\` | Extended vowel, melisma | Soulful house hooks |
| Mumble mode | \\\`mmm\\\`, \\\`nnn\\\`, \\\`hmm\\\` | Humming, non-verbal | Deep house atmosphere |
| Breathy pause | \\\`ah...\\\` | Breathed syllable with trailing space | Intimate breakdowns |
| Staccato | \\\`da-da-da-da\\\` | Short, rhythmic delivery | Tech house vocal chops |
| Call out | \\\`HEY!\\\` | Shouted emphasis (caps + exclamation) | Drop impacts |
| Stretched vowel | \\\`feeeel\\\` | Extended vowel sound | Emotional house moments |
| Whisper build | \\\`(whispered) come closer...\\\` | Whispered with trailing fade | Pre-drop tension |

### Example Using Phonetic Tricks

\\\`\\\`\\\`
[Verse 1]
Wata fall down pon di ground
Na ami... feel it all around
Mmm... mmm...

[Build]
(energy rising)
da-da-da-da-da

[Drop]
HEY!
Feeeel the rhythm tonight...
\\\`\\\`\\\`

---

## Complete Example: V5.5 Tech House Track

**Style of Music:**
\\\`\\\`\\\`
Tech House, 126 bpm, punchy TR-909 kick, rolling bassline, dry male vocals, percussive, minimal, no guitar
\\\`\\\`\\\`
(96 characters, 7 descriptors, genre+BPM front-loaded, single genre, no arrangement cues)

**Lyrics:**
\\\`\\\`\\\`
[Intro]
(Rhythmic percussion, hi-hats, atmospheric tension)

[Verse 1]
Moving through the shadows
Bass beneath my feet
Every single heartbeat
Locked into the beat

[Build]
(Snare roll rising, filter opening, energy climbing)

[Drop]
(Heavy bass, kick returns, maximum energy)
[Instrumental Hook]

[Verse 2]
Lost inside the rhythm
Never wanna leave
da-da-da-da-da
Feeeel...

[Breakdown]
(Drums cut out, atmospheric pads, spacious)
Mmm... mmm...

[Build]
(Rapid rise, tension peak)

[Drop]
(Explosive energy, full groove)
HEY!

[Outro]
(Drums only, fading out, DJ-friendly)
\\\`\\\`\\\`

**Sliders:** Weirdness 25% | Style Influence 75% | Audio Influence N/A

Generate 5 variations. Cherry-pick the best. Move to DAW for stem separation and DJ edit construction.

Complete guide to generating vocals, creating covers, and building DJ edits with Suno V5.5. Covers the Voices feature, vocal prompting rules, Covers Mode workflow, remix slider presets, section surgery, DJ edit construction, and legal considerations.

---

## Vocal Prompting — The Two-Field Rule

The single most important rule for V5.5 vocal work: **vocal direction goes in the Style field, NOT the Lyrics field.**

| What | Where | Example |
|------|-------|---------|
| Vocal tone/character | Style field | \\\`soulful female vocals\\\`, \\\`dry male vocals\\\`, \\\`robotic\\\` |
| Vocal delivery style | Style field | \\\`whispered\\\`, \\\`powerful diva\\\`, \\\`breathy\\\` |
| Vocal processing | Style field | \\\`processed vocals\\\`, \\\`autotune\\\`, \\\`vocoder\\\` |
| Actual lyrics (words to sing) | Lyrics field | \\\`Move your body to the sound\\\` |
| Structure tags | Lyrics field | \\\`[Verse 1]\\\`, \\\`[Chorus]\\\`, \\\`[Drop]\\\` |
| Vocal style tags | Lyrics field | \\\`[Female Vocals]\\\`, \\\`[Whisper]\\\`, \\\`[Spoken Word]\\\` |

Putting genre or instrumentation descriptions in the Lyrics field causes the AI to literally sing those words.

### Vocal Prompt Formula (Style Field)

\\\`\\\`\\\`
[Genre], [BPM] bpm, [Vocal tone], [Vocal gender], [Mood], [1-2 instruments], [Vibe]
\\\`\\\`\\\`

### Examples by Sub-Genre

| Sub-Genre | Style Prompt |
|-----------|-------------|
| Deep House | \\\`Deep House, 122 bpm, soulful male vocals, warm bass, atmospheric pads, emotional, intimate\\\` |
| Tech House | \\\`Tech House, 126 bpm, dry robotic male vocals, punchy kick, rolling bassline, minimal\\\` |
| Disco House | \\\`Disco House, 124 bpm, powerful diva female vocals, funky bassline, lush strings, uplifting\\\` |
| Piano House | \\\`Piano House, 128 bpm, bright soulful female vocals, piano stabs, festival energy, euphoric\\\` |
| Afro House | \\\`Afro House, 124 bpm, tribal chant vocals, organic percussion, marimba, spiritual, warm\\\` |

---

## V5.5 Voices Feature (Voice Cloning)

### Requirements

- Pro or Premier Suno subscription
- Clean vocal sample: minimum 10 seconds, recommended 30-60 seconds
- WAV format, 44.1kHz/24-bit, dry (no effects, no room reverb)

### Voice Cloning Workflow

1. **Record source audio** in your DAW. Not your phone. Set up a pop filter, get close to the mic, treat the room or use a reflection filter. Record 30-60 seconds of singing across the vocal range you need.
2. **Export dry WAV** — no compression, no EQ, no reverb, no limiting. The model needs the raw voice.
3. **Upload to Suno Voices** — navigate to Voices section, click Create Voice, upload your WAV.
4. **Name the voice** descriptively: \\\`Ben-Chest-Voice\\\`, \\\`Ben-Falsetto\\\`, \\\`Session-Singer-Alto\\\`.
5. **Create separate clones per register:**
   - Chest voice (low-mid range)
   - Head voice (mid-high range)
   - Falsetto (high range, if applicable)
   - The model handles register transitions poorly with a single clone covering the full range.
6. **Verification test:** Generate a short clip with the lyrics "la la la, do re mi, one two three" to confirm tonal accuracy before committing to full production.

### Slider Settings for Voice Clones

| Slider | Setting | Why |
|--------|---------|-----|
| Weirdness | 25% | Keeps vocal delivery predictable and natural |
| Style Influence | 75% | Balances your style prompt with the voice character |
| Audio Influence | 25% | Critical — this is the maximum for clean voice clones |

**Audio Influence above 25%** starts capturing room noise, mic coloration, compression artifacts, and breathing patterns from the source recording. At 40%+ the output develops audible distortion.

---

## Generating Vocal Takes

### The 3-5 Rule

Never use the first generation. Always generate 3-5 takes per prompt, then cherry-pick.

| Take | Evaluate For |
|------|-------------|
| Take 1 | Baseline — check if prompt is generating the right style |
| Take 2 | Compare phrasing and timing against take 1 |
| Take 3 | Listen for emotional delivery — does it feel right? |
| Take 4-5 | Experimental — slight prompt tweaks for variation |

### Compositing (The Brainwashing Technique)

After generating 3-5 takes of the same lyrics:

1. Import all takes into your DAW on separate tracks
2. Solo each take and mark the best sections:
   - Best verse 1 phrasing (e.g., take 3)
   - Best chorus delivery (e.g., take 1)
   - Best ad-libs (e.g., take 5)
   - Best bridge emotion (e.g., take 2)
3. Comp (composite) the best parts onto a single track
4. Crossfade at edit points (5-15ms) to smooth transitions
5. Process the comp as a single vocal performance

This is standard professional vocal production — applied to AI takes instead of studio takes.

### Vocal Types to Generate Separately

| Type | Prompt Approach | Use |
|------|----------------|-----|
| Lead vocal | Full lyrics, primary style prompt | Main vocal track |
| Hook/chorus only | Only chorus lyrics, \\\`[Chorus]\\\` tag | Drop impact, sing-along |
| Ad-libs | \\\`[Ad-lib]\\\` tag, short phrases: "yeah," "come on," "uh" | Background texture |
| Spoken intro | \\\`[Spoken Word]\\\` tag, short sentence | DJ set intros, transitions |
| Vocal chops | Short 2-4 word phrases, repeated | Rhythmic elements, tech house |
| Backing harmonies | Same lyrics as lead, different vocal tone in style | Layering depth |

---

## DAW Vocal Processing Chain

Process every AI vocal through this chain before mixing.

### Signal Chain (Insert Order)

| Step | Plugin | Settings | Purpose |
|------|--------|----------|---------|
| 1. EQ (subtractive) | FabFilter Pro-Q 3 / EQ Eight | HP 80-120Hz (24dB/oct), cut 200-350Hz (-2 to -3dB, Q 1.5), tame 3-5kHz if harsh | Remove mud, room resonance |
| 2. De-esser | FabFilter Pro-DS / Ableton De-esser | Target 5-8kHz, threshold until sibilance tamed | Control "s" and "t" sounds |
| 3. Compression | FabFilter Pro-C 2 / Ableton Compressor | Ratio 3:1, attack 10ms, release 40ms, 2-4dB GR | Even out dynamics |
| 4. EQ (additive) | Same EQ plugin | Air shelf +1-2dB at 12kHz, presence +1dB at 2-4kHz | Add clarity and sparkle |
| 5. Saturation | Soundtoys Decapitator / Ableton Saturator | Drive 10-20%, mix 30-50% | Add warmth and character |
| 6. Stereo width | Ableton Utility / iZotope Imager | Widen above 300Hz only, mono below | Create space without muddying |

### Send Effects (Return Tracks)

| Send | Plugin | Settings | When to Use |
|------|--------|----------|-------------|
| Reverb | Valhalla VintageVerb / Ableton Reverb | Plate, decay 1.2-1.8s, HP 200Hz, LP 8kHz, 15-25% wet | Constant — all vocals need space |
| Delay | Soundtoys EchoBoy / Ableton Delay | 1/4 or 1/8 sync, feedback 15-25%, HP 300Hz, LP 6kHz | Automated throws on phrase endings |
| Long reverb | Valhalla Shimmer / Ableton Reverb | Hall, decay 3-5s, HP 300Hz, modulation on | Breakdown moments, emotional peaks |

### Processing by Sub-Genre

| Sub-Genre | Reverb | Delay | Compression | Character |
|-----------|--------|-------|-------------|-----------|
| Deep House | Lush plate, 1.8-2.5s | 1/4 dotted, subtle | Gentle 2:1 | Wide, warm, spacious |
| Tech House | Tight room, 0.5-0.8s | 1/8 short, dry | Aggressive 4:1 | Tight, present, minimal |
| Piano House | Bright plate, 1.5-2.0s | 1/4 sync, moderate | Medium 3:1 | Bright, upfront, powerful |
| Disco House | Warm hall, 2.0-3.0s | 1/8 dotted, warm | Gentle 2:1 | Warm, wide, vintage |

---

## Covers Mode Workflow

Covers Mode lets you upload an existing track and have Suno V5.5 re-perform it.

### Step-by-Step

1. **Upload source track** — MP3 or WAV, any quality (Suno transcribes internally)
2. **Click "Use Style and Lyrics"** — Suno extracts the style description and lyrics from the upload
3. **VERIFY the model is V5.5** — Covers Mode sometimes defaults to V4. Check the model dropdown.
4. **Review extracted lyrics** — Suno's transcription is not perfect. Fix errors, add structure tags if missing
5. **Review extracted style** — Suno's style extraction is often too verbose. Trim to 4-7 descriptors under 1,000 chars
6. **Set sliders** based on your intent (see table below)
7. **Generate 3-5 versions** — cherry-pick the best
8. **Export WAV** — never MP3 from Suno

### Covers Mode — Remix Slider Presets by Intent

| Intent | Weirdness | Style Influence | Audio Influence | Result |
|--------|-----------|-----------------|-----------------|--------|
| Preserve identity (faithful cover) | 0% | 90% | 50% | Sounds like the original re-recorded in V5.5 quality |
| Polish (upgrade quality) | 15% | 80% | 40% | Original character with V5.5 production polish |
| Modernise (genre shift) | 25% | 75% | 30% | Recognisable but in a new genre/style |
| Transform (radical reimagining) | 35% | 70% | 25% | Same lyrics/melody, completely new sonic identity |
| Deconstruct (abstract) | 50% | 60% | 15% | Loose reference, experimental territory |

### Cover Prompt Examples

**Disco Classic to Deep House:**
\\\`\\\`\\\`
Style: Deep House, 122 bpm, warm bass, atmospheric pads, soulful female vocals, late-night
Sliders: W25 / S75 / A30
\\\`\\\`\\\`

**Pop Hit to Tech House:**
\\\`\\\`\\\`
Style: Tech House, 126 bpm, punchy kick, rolling bassline, robotic male vocals, minimal, percussive
Sliders: W25 / S80 / A25
\\\`\\\`\\\`

**Rock Ballad to Piano House:**
\\\`\\\`\\\`
Style: Piano House, 128 bpm, bright piano stabs, emotional female vocals, uplifting, festival energy
Sliders: W20 / S80 / A35
\\\`\\\`\\\`

---

## Section Surgery (Post-Generation Editing)

V5.5 provides three tools for editing after generation.

### Editor (Lyrics Modification)

- Changes lyrics in specific sections without regenerating the entire track
- Select the section to edit, type new lyrics, re-render
- Preserves melody, instrumentation, and groove
- Use for: fixing misheard words, changing a single line, improving a hook

### Studio (Instrument Adjustment)

- Adjust levels of individual elements within the generation
- Mute/solo vocals, drums, bass, melody
- Limitation: stems are capped at 16kHz — use for selection/preview only, NOT for final export
- Use for: previewing which elements work, quick checks before DAW import

### Extend (Adding Bars)

- Append additional bars to the end of a generation
- Maintains style and key from the original
- Use for: adding a DJ-friendly outro, extending a breakdown, creating longer instrumentals
- Always copy the EXACT style prompt from the original when extending

### When to Use Each Tool

| Goal | Tool | Notes |
|------|------|-------|
| Fix a lyric line | Editor | Non-destructive to music |
| Check if vocal is usable | Studio (solo vocal) | Preview only — don't export |
| Add 16-bar DJ outro | Extend | Use \\\`[Outro] (drums only, fading out)\\\` in lyrics |
| Remove vocal from a section | Re-generate section | Use \\\`[Instrumental]\\\` tag in lyrics for that section |
| Change instrument balance | DAW (after stem separation) | Suno Studio stems are 16kHz — always use external tools |

---

## DJ Edit Construction

### Mashup Workflow

1. Generate vocals inspired by Artist A (do NOT use copyrighted lyrics)
2. Generate instrumental inspired by Artist B's production style
3. Stem-separate the instrumental using Demucs \\\`htdemucs_ft\\\`
4. Import AI vocal + instrumental stems into Ableton
5. Key-match using Tunebat/Mixed In Key or Ableton's tuner
6. Tempo-lock both to the target BPM
7. Layer vocal over instrumental, adjusting timing and pitch as needed
8. Process vocal through the chain above
9. Build 32-bar intro and 16-bar outro

### Transition Tool Creation

| Tool Type | Suno Prompt (Style Field) | Lyrics Field |
|-----------|--------------------------|-------------|
| Spoken intro | \\\`House, 124 bpm, spoken female vocals, atmospheric, warm\\\` | \\\`[Spoken Word] Get ready to move...\\\` |
| Vocal riser | \\\`House, 126 bpm, processed female vocals, rising energy\\\` | \\\`[Build] (energy rising) Aaaah...\\\` |
| Drop shout | \\\`Tech House, 126 bpm, male vocals, powerful, aggressive\\\` | \\\`[Drop] HEY!\\\` |
| Ambient pad | \\\`Deep House, 122 bpm, atmospheric pads, no vocals, ethereal\\\` | \\\`[Instrumental] (spacious, wide, evolving)\\\` |

### Vocal Loop Creation

1. Generate a short vocal phrase (4-8 words) using Suno
2. Export WAV and import to Ableton
3. Set Warp mode to Complex Pro
4. Find the cleanest 1-2 bar section
5. Set loop points on exact bar boundaries
6. Consolidate the loop (Cmd+J in Ableton)
7. Process: HP filter 150Hz, subtle compression 2:1, short reverb
8. Duplicate and pitch-shift +7 or +12 semitones for a harmony layer
9. Export as WAV one-shot for use in Simpler/Sampler

---

## Legal Considerations

### What You Can Release

| Scenario | Status | Notes |
|----------|--------|-------|
| 100% AI-generated (original lyrics, original melody) | Safe — full ownership | Suno's ToS grants commercial rights on paid plans |
| AI vocals inspired by an artist's style | Safe | Style is not copyrightable |
| AI cover with original copyrighted lyrics | Requires mechanical license | Obtain via HFA, Songtrust, or DistroKid cover license |
| AI cover replicating specific melody | Requires sync/mechanical license | Melody is copyrightable |
| DJ edit for personal set use only | Generally safe | Do not distribute or monetise |
| AI generation using copyrighted audio upload | Risky — potential infringement | Only upload audio you own or have licensed |

### Suno-Specific Legal Rules

- **Paid plans (Pro/Premier):** Commercial usage rights granted for all generations
- **Free plan:** Non-commercial use only
- **"Allow Remix" toggle:** Do NOT enable on tracks you want to control. Enabling it lets any Suno user remix your generation.
- **Custom Models:** Trained on your own uploads — ensure you own the training material
- **Voice Clones:** Only clone voices you have permission to clone. Cloning another artist's voice without consent is ethically and potentially legally problematic.

### Protecting Your Work

1. Register releases with a distributor that handles ContentID (DistroKid, TuneCore, AWAL)
2. Disable "Allow Remix" on all Suno generations you plan to release
3. Keep records of your Suno prompts and generation timestamps as proof of creation
4. For covers: obtain mechanical license BEFORE distribution (HFA, Songtrust, or DistroKid's cover song licensing)
5. When in doubt: use for DJ sets only, do not distribute commercially

---

## Quick Reference — Vocal Generation Checklist

1. Write lyrics in a text editor first (not directly in Suno)
2. Add structure tags: \\\`[Verse 1]\\\`, \\\`[Chorus]\\\`, \\\`[Drop]\\\`, etc.
3. Add energy cues in parentheses between sections
4. Craft style prompt: genre + BPM + vocal descriptor + 2-3 instruments + mood
5. Keep style prompt under 1,000 chars, 4-7 descriptors
6. Set sliders: W25 / S75 / A25 (voice clone) or W25 / S75 / no audio (original)
7. Verify model is V5.5
8. Generate 3-5 takes
9. Cherry-pick and comp in DAW
10. Process through vocal chain: EQ → de-ess → compress → saturate → reverb/delay sends

The main pipeline guide. Takes Suno V5.5 output through stem extraction, BPM locking, DJ intro/outro construction, transition engineering, tonal matching, Ableton template setup, mastering, and batch production.

---

## Stem Extraction

### Why to Skip Suno Studio Stems

Suno Studio offers built-in stem separation. Do NOT use it for final production.

| Issue | Detail |
|-------|--------|
| 16kHz sample rate ceiling | All Studio stems are capped at 16kHz regardless of input. House music needs full 20kHz+ bandwidth for hats, air, vocal presence. |
| MP3 artifact inheritance | Suno's internal processing introduces lossy compression artifacts that compound when you process stems further in your DAW. |
| Credits cost | Each Studio separation costs credits. External tools are free and produce superior results. |
| Limited separation quality | 2-stem or 4-stem only. External tools offer 4-6 stems with better isolation. |

Studio stems are fine for quick previews and selection. Never use them in your final mix.

### Demucs CLI (Primary Tool — Free)

Demucs is Meta's open-source stem separation model. The \\\`htdemucs_ft\\\` model is the current best for music production.

**Install:**
\\\`\\\`\\\`bash
pip install demucs
\\\`\\\`\\\`

**Single file:**
\\\`\\\`\\\`bash
demucs -n htdemucs_ft "track.wav"
\\\`\\\`\\\`

**Batch process (entire folder):**
\\\`\\\`\\\`bash
demucs -n htdemucs_ft *.wav
\\\`\\\`\\\`

**Output structure:**
\\\`\\\`\\\`
separated/
  htdemucs_ft/
    track/
      bass.wav
      drums.wav
      other.wav    # synths, pads, instruments
      vocals.wav
\\\`\\\`\\\`

| Model | Stems | Quality | Speed (M1 Pro, 3min track) | Use Case |
|-------|-------|---------|---------------------------|----------|
| \\\`htdemucs_ft\\\` | 4 (drums, bass, vocals, other) | Best overall | ~45-60s | Primary choice for all production |
| \\\`htdemucs\\\` | 4 | Good | ~30-40s | Faster, slightly less precise |
| \\\`htdemucs_6s\\\` | 6 (drums, bass, vocals, guitar, piano, other) | Good on guitar/piano | ~90s | When you need guitar or piano isolated |
| \\\`mdx_extra\\\` | 4 | Legacy | ~30s | Fallback only |

**Performance benchmarks:**

| Hardware | htdemucs_ft (3min track) | Batch 10 tracks |
|----------|--------------------------|-----------------|
| M1 MacBook Air | ~90s | ~15 min |
| M1 Pro MacBook Pro | ~50s | ~8 min |
| M2 Max Mac Studio | ~30s | ~5 min |
| Intel i7 + RTX 3080 | ~25s | ~4 min |
| Intel i5 (no GPU) | ~180s | ~30 min |

### UVR5 (Ultimate Vocal Remover — Free, GUI)

Download from github.com/Anjok07/ultimatevocalremovergui. Version 5.6+.

| Model | Best For | Quality |
|-------|----------|---------|
| MDX23C-InstVoc | Vocal isolation (vocal vs. instrumental) | Best vocal quality — use this for acapella extraction |
| Mel-Band RoFormer | Lowest artifact vocals | Slightly less separation but cleaner vocal output |
| Kim Vocal 2 | Fast vocal extraction | Good quality, faster processing |
| htdemucs_ft (built-in) | Full 4-stem separation | Same model as CLI, just with GUI |

**Recommended workflow:** Use UVR5 MDX23C-InstVoc for the vocal stem, then Demucs \\\`htdemucs_ft\\\` for drums/bass/other separation of the instrumental.

### Post-Processing Drums After Separation

Even the best stem separation leaves artifacts. Clean up drum stems in your DAW.

| Issue | Fix | Plugin/Setting |
|-------|-----|----------------|
| Sub rumble below kick | HP filter at 25-30Hz, 24dB/oct | EQ Eight, Pro-Q 3 |
| Hi-hat bleed in kick | LP filter at 8-10kHz (gentle 6dB/oct) on a duplicated kick-only layer | EQ Eight |
| Kick lacks punch | Transient shaper: +3-5dB attack, -2dB sustain | Ableton Drum Buss, SPL Transient Designer |
| Snare/clap too thin | Parallel compression: duplicate, compress 10:1, blend at -12dB | Ableton Compressor on return track |
| Hat bleed in bass stem | HP at 150Hz on bass stem, LP at 5kHz | EQ Eight |

---

## BPM Fixing

### The Problem

Suno V5.5 drifts +-0.5 BPM from the requested tempo. A track requested at 126 BPM might actually be 125.7 or 126.3 BPM. This destroys beatmatching and makes DJ mixing impossible. Every Suno track must be tempo-locked before building DJ edits.

### Finding Suno's Actual BPM

| Method | How | Accuracy |
|--------|-----|----------|
| Ableton auto-detect | Drag WAV into Ableton, right-click clip → "Warp From Here (Straight)" → read detected BPM | +-0.1 BPM |
| Tap tempo | Play the track, tap along using an online tap tempo tool or Ableton's tap tempo | +-0.5 BPM |
| Transient alignment | Zoom into the drum stem waveform, measure the distance between kick transients, calculate BPM from the interval | +-0.05 BPM (most precise) |

### Method 1: Suno Studio (Quick Fix)

1. Open the track in Suno Studio
2. Click "Project Tempo"
3. Switch from "Auto" to "Manual BPM"
4. Enter your exact target BPM (e.g., 126.00)
5. Export the tempo-corrected version
6. Limitation: introduces minor time-stretch artifacts at large corrections (>0.5 BPM difference)

### Method 2: Ableton Live (Recommended)

1. Import all stems (drums, bass, vocals, other) into separate Ableton tracks
2. Set project BPM to your exact target (e.g., 126.00)
3. Select each clip and enable Warp

| Stem Type | Warp Mode | Why |
|-----------|-----------|-----|
| Drums | Beats | Preserves transient attack and rhythmic precision |
| Bass | Complex Pro | Prevents bass note pitch artifacts from time-stretching |
| Vocals | Complex Pro | Preserves vocal formants and natural tone |
| Other (synths, pads) | Complex Pro | Preserves harmonic content and stereo image |

4. For the drum stem: zoom to the first kick transient. Set the first warp marker exactly on the downbeat of bar 1. Set a second warp marker on a kick transient 8 or 16 bars later. Verify alignment.
5. For other stems: align the first transient to the same bar 1 position. Ableton's warping handles the rest.
6. Verify: play the track with Ableton's metronome enabled. Every kick should land exactly on the beat. If not, add additional warp markers at drift points.
7. Consolidate all clips (Cmd+J) once timing is locked.

### Method 3: Logic Pro

1. Import stems into Logic
2. Select all regions
3. Open the Region Inspector
4. Uncheck "Follow Tempo" to remove any embedded tempo data
5. Select the region → Tempo → "Apply Region Tempo to Project Tempo"
6. Set project tempo to your target BPM
7. Enable Flex Time: Rhythmic for drums, Polyphonic for melodic content
8. Verify with metronome

---

## Building the 32-Bar DJ Intro

The DJ intro makes your track mixable. Without it, DJs cannot blend in from the previous track. This is non-negotiable for any track intended for DJ sets.

### Architecture

| Bars | Content | Volume | HP Filter | Reverb Send |
|------|---------|--------|-----------|-------------|
| 1-8 | Kick + hat loop only | -12 dB | 260 Hz | -inf dB |
| 9-16 | + shaker, + ride | -9 dB | 220 Hz | -12 dB |
| 17-24 | + clap, + perc fills | -6 dB | 140 Hz | -9 dB |
| 25-28 | + bass (filtered), + pad hint | -3 dB | 80 Hz | -6 dB |
| 29-32 | Full drums, bass opening up | 0 dB | 50 Hz | 0 dB |
| 33 (Drop) | FULL TRACK — everything enters | 0 dB | Off (or 20 Hz) | -inf dB (hard cut) |

### Step-by-Step Ableton Setup

**Track Setup:**
1. Create a new audio track: "Intro Loop"
2. Copy the drum stem's first 4-bar loop onto this track
3. Loop the 4-bar pattern for 32 bars (Cmd+D to duplicate 8 times)
4. Place at the very start of the arrangement (bar 1)

**Volume Automation:**
1. Select the "Intro Loop" track
2. Open automation view (A key)
3. Select "Track Volume"
4. Draw automation points: Bar 1: -12 dB, Bar 9: -9 dB, Bar 17: -6 dB, Bar 25: -3 dB, Bar 33: 0 dB
5. Use linear ramps between each point

**HP Filter Sweep:**
1. Add Ableton Auto Filter to the "Intro Loop" track
2. Set filter type: High Pass, 24 dB/oct slope
3. Resonance: 0.25-0.35 (subtle peak, not aggressive)
4. Automate the frequency parameter: Bar 1: 260 Hz, Bar 9: 220 Hz, Bar 17: 140 Hz, Bar 25: 80 Hz, Bar 33: 50 Hz (or bypass the filter)
5. Shape: use an exponential curve — 75% of the frequency drop happens in the last 8 bars

### Drop Impact Techniques (Bar 33)

- Hard-cut the reverb send (not gradual — instant -inf)
- Bring in the full track: vocals, bass, all synths
- Optional: 1-bar silence or "suck" effect before bar 33 (reverse cymbal, white noise cut)
- Optional: impact sample (boom, sub drop) on the downbeat of bar 33

---

## Building the 16-Bar DJ Outro

The outro lets DJs blend out to the next track.

### Architecture

| Bars | Content | Actions |
|------|---------|---------|
| 1-4 | Drums + bass + synths (no vocals) | Mute vocal tracks at bar 1 of outro |
| 5-8 | Drums + bass + filtered synths | LP filter on synths/pads sweeping down to 2 kHz |
| 9-12 | Drums + filtered pads only | Mute bass track. Only drums and filtered pad/atmosphere remain |
| 13-16 | Drums only, fading | Volume automation -3 dB → -12 dB. Reverb send rising -6 dB → 0 dB |
| Final bar | Silence (mute drums) | Leave 1-2 bars of reverb tail only, then silence |

---

## Transition Engineering

### HP Filter Sweep (The Most Important Transition Tool)

The HP sweep is the backbone of house music mixing. Getting the curve shape right is critical.

**Auto Filter Settings:**
- Type: High Pass
- Slope: 24 dB/oct
- Start frequency: 220-280 Hz
- End frequency: 40-60 Hz
- Resonance: 0.25-0.35

**Curve shape:** Exponential hockey-stick. 75% of the frequency change happens slowly (first 75% of the sweep), then 25% drops steeply in the final bars.

### Noise Riser

White or pink noise sweep that builds energy before a drop.

1. Create audio/synth track with white noise or pink noise source
2. HP filter: 150-250 Hz static (removes sub rumble)
3. LP filter sweep (automated): Start: 4 kHz, End: 16 kHz, Duration: 8-16 bars
4. Volume automation: Start: -18 dB, End: -3 dB
5. Hard cut to -inf on the drop. Do NOT fade — instant silence.

---

## Ableton Template Specification

### Track Layout (10-14 tracks in 4 groups)

\\\`\\\`\\\`
GROUP: SOURCE (Colour: Blue)
-- 1. Suno Full Mix        (Audio) — Original Suno export, muted after stem split
-- 2. Suno Vocal Stem      (Audio) — Demucs vocal output
-- 3. Suno Drum Stem       (Audio) — Demucs drums output
-- 4. Suno Bass Stem       (Audio) — Demucs bass output
-- 5. Suno Other Stem      (Audio) — Demucs other output

GROUP: EDIT LAYERS (Colour: Green)
-- 6. Processed Vocal      (Audio) — Vocal after processing chain
-- 7. Vocal Chops          (Audio/MIDI) — Chopped/sampled vocal elements

GROUP: DRUM LAYERS (Colour: Orange)
-- 8. Intro Loop           (Audio) — 32-bar intro drum loop
-- 9. Outro Loop           (Audio) — 16-bar outro drum loop
-- 10. Drum Enhancement    (MIDI) — Additional kicks, hats, percs

GROUP: UTILITY (Colour: Grey)
-- 11. Noise Riser         (Audio/Synth) — White/pink noise for transitions
-- 12. Reference Track     (Audio) — Commercial reference, muted, for A/B
\\\`\\\`\\\`

### 4 Send/Return Tracks

| Return | Name | Plugin | Settings |
|--------|------|--------|----------|
| A | Short Verb | Ableton Reverb | Plate, Decay 1.2s, HP 200Hz, LP 8kHz, Dry/Wet 100% |
| B | Tempo Delay | Ableton Delay | Ping Pong, 1/4 sync, Feedback 25%, HP 200Hz, LP 8kHz, Dry/Wet 100% |
| C | Long Wash | Valhalla VintageVerb | Hall, Decay 3.5s, HP 300Hz, LP 6kHz, Modulation on, Dry/Wet 100% |
| D | FX Throw | Ableton Delay + Reverb (serial) | 1/8 dotted delay, Feedback 30% → Plate reverb, Decay 1.5s |

### Pre-Master Chain

| Position | Plugin | Settings | Purpose |
|----------|--------|----------|---------|
| 1 | Glue Compressor | Ratio 2:1, Attack 10ms, Release Auto, Threshold for 1-2dB GR | Glue the mix |
| 2 | Saturator | Drive 2-4dB, Type: Analog Clip, Dry/Wet 30% | Warmth and harmonic density |
| 3 | Limiter | Ceiling -1.0 dBTP, no gain (mastering handles loudness) | Catch peaks during production |

---

## Mastering Pipeline

### House Music Targets

| Parameter | Target | Why |
|-----------|--------|-----|
| Integrated LUFS | -7 LUFS | Standard for club/DJ house music |
| True Peak | -1 dBTP | Prevents inter-sample peaks from clipping |
| Short-term LUFS range | 4-7 LU | House should breathe — drops louder than breakdowns |

### Export Settings

| Format | Settings | Use |
|--------|----------|-----|
| WAV 44.1kHz/24-bit | Dither: Triangular | DJ promo, distribution, master archive |
| WAV 44.1kHz/16-bit | Dither: POW-r 1 | CD distribution |
| MP3 320kbps CBR | LAME encoder, Joint Stereo | Online distribution, DJ pool uploads |

---

## Complete Batch Pipeline (At Scale)

### The 8-Step Pipeline

| Step | Action | Tool | Time Per Track |
|------|--------|------|----------------|
| 1. GENERATE | Batch 5-10 tracks in Suno V5.5 | Suno V5.5 | 10-15 min |
| 2. SELECT | Cherry-pick the best 2-3 | Suno player | 15-20 min |
| 3. SEPARATE | Demucs htdemucs_ft on all selected tracks | Demucs CLI + UVR5 | 5-10 min |
| 4. LOCK BPM | Import stems, warp, consolidate | Ableton Live | 10-15 min |
| 5. BUILD | Template, intro, outro, transitions | Ableton Live | 30-45 min |
| 6. MATCH | SPAN analysis, EQ corrections, glue comp | SPAN + EQ + Comp | 10-15 min |
| 7. MASTER | LANDR batch or Ozone precision | LANDR / Ozone 11 | 5-10 min |
| 8. EXPORT | WAV + MP3, verify with Youlean | Ableton / Youlean | 5 min |

**Total per track: ~90-120 minutes from Suno generation to mastered DJ-ready export.**

{id:'house-essentials',title:'House Music Essentials',shortTitle:'House Music Essentials',content:`# House Music Essentials

Genre theory and production fundamentals for the hybrid AI producer. Quick-reference for subgenre DNA, BPM ranges, V5.5 slider settings, and style prompt templates.

---

## BPM Reference Table

| Subgenre | BPM Range | Sweet Spot |
|----------|-----------|------------|
| Deep House | 118-124 | 120 |
| Soulful House | 120-126 | 123 |
| Disco House / Nu-Disco | 120-126 | 124 |
| Lo-Fi House | 118-124 | 120 |
| Afro House | 120-128 | 124 |
| Piano House | 124-130 | 126 |
| UK Garage | 128-135 | 130 |
| Tech House | 124-130 | 126 |
| Minimal House | 124-128 | 126 |
| Anthemic / Festival | 126-130 | 128 |

---

## V5.5 Slider Recommendations by Subgenre

| Subgenre | Weirdness | Style Influence | Audio Quality | Notes |
|----------|-----------|-----------------|---------------|-------|
| Tech House | 20-30% | 75-85% | 50% | Higher style keeps the groove tight |
| Disco House | 20-25% | 80-85% | 50% | Lock the funk — low weirdness |
| Minimal House | 30-40% | 70-75% | 50% | Extra weirdness adds texture |
| Piano House | 15-25% | 80-85% | 50% | Keep it clean and commercial |
| Deep House | 25-35% | 70-80% | 50% | Room for atmosphere |
| Soulful House | 20-25% | 80-85% | 50% | Prioritise vocal clarity |
| Lo-Fi House | 35-45% | 60-70% | 40% | Weirdness = character here |
| UK Garage | 25-30% | 75-80% | 50% | Shuffled hats need style lock |
| Afro House | 25-35% | 70-80% | 50% | Percussion complexity benefits from mid-weirdness |
| Anthemic / Festival | 15-20% | 85% | 50% | Maximum style lock for crowd-ready sound |

> **Voice clones:** Set Audio Quality to 25% when using custom voice models.

---

## Subgenre Profiles

### Tech House

**DNA:** Rolling basslines, punchy drums, minimal hooks, peak-time energy.

**Key Elements:**
- Groovy repetitive basslines
- Sharp percussive drums and hi-hats
- Minimal vocal chops or phrases
- Tension-building rises
- Sidechain-pumped compression

**Producers to Study:** John Summit, Fisher, Dom Dolla, CamelPhat, Solardo, Chris Lake

**V5.5 Style Prompt:**
\\\`\\\`\\\`
Tech House at 126 BPM, rolling bassline, sharp percussion, minimal male vocal hook, peak-time energy, punchy kick. Exclude: ambient pads, acoustic guitar, orchestral.
\\\`\\\`\\\`

---

### Disco House / Nu-Disco

**DNA:** Funk bass, lush strings, soulful vocals, feel-good loop energy.

**Producers to Study:** Purple Disco Machine, Dimitri From Paris, The Shapeshifters, Mousse T.

**V5.5 Style Prompt:**
\\\`\\\`\\\`
Disco House at 124 BPM, funk guitar riffs, soulful female vocals, lush strings, slap bass, warm groovy production. Exclude: dark atmosphere, distortion, acid.
\\\`\\\`\\\`

---

### Piano House

**DNA:** Euphoric melodies, uplifting chords, emotional vocals, festival-ready energy.

**Producers to Study:** Joel Corry, MK, Sigala, Shane Codd, Ben Rainey, MEDUZA

**V5.5 Style Prompt:**
\\\`\\\`\\\`
Piano House at 126 BPM, bright piano stabs, soulful female vocals, uplifting chords, driving bassline, energetic production. Exclude: dark atmosphere, acid, minimal.
\\\`\\\`\\\`

---

### Deep House

**DNA:** Smooth, warm, atmospheric, introspective. The emotional side of house.

**Producers to Study:** Kerri Chandler, Maya Jane Coles, Dusky, Jimpster, Claptone

**V5.5 Style Prompt:**
\\\`\\\`\\\`
Deep House at 120 BPM, warm bassline, atmospheric pads, soulful male vocals, smooth jazzy chords, relaxed groove. Exclude: aggressive drums, rave stabs, distortion.
\\\`\\\`\\\`

---

### Lo-Fi House

**DNA:** Dusty, tape-saturated, raw. Vinyl crackle and imperfection as character.

**Producers to Study:** DJ Seinfeld, Ross From Friends, Mall Grab, Baltra

**V5.5 Style Prompt:**
\\\`\\\`\\\`
Lo-Fi House at 120 BPM, dusty drums, tape-saturated bassline, vinyl crackle texture, muffled vocal sample, raw warm production. Exclude: polished, bright, commercial.
\\\`\\\`\\\`

---

### UK Garage

**DNA:** Shuffled beats, choppy vocals, sub-bass pressure, 2-step rhythms.

**Producers to Study:** Disclosure, El-B, MJ Cole, Nathan Dawe, Skrillex (new era)

**V5.5 Style Prompt:**
\\\`\\\`\\\`
UK Garage at 130 BPM, shuffling 2-step drums, pitched vocal chops, heavy sub-bass, shuffling hi-hats, skippy rhythm. Exclude: four-to-the-floor kick, trance, ambient.
\\\`\\\`\\\`

---

### Afro House

**DNA:** Polyrhythmic percussion, tribal drums, organic textures, spiritual energy.

**Producers to Study:** Black Coffee, Shimza, Da Capo, Enoo Napa

**V5.5 Style Prompt:**
\\\`\\\`\\\`
Afro House at 124 BPM, polyrhythmic tribal percussion, deep bassline, organic kalimba melody, chanted vocals, spiritual energy. Exclude: piano stabs, pop vocals, acid.
\\\`\\\`\\\`

---

## The Five Golden Rules of House Production

### 1. Groove Is King
The groove is the heartbeat. Focus on bassline movement, drum swing, percussive accents, syncopation, and ghost notes.

### 2. Less Is More
House thrives on simplicity and repetition. 5-8 core elements is often enough. Let each sound breathe.

### 3. Vocals Drive Emotion
From soulful hooks to chopped rhythmic textures, vocals elevate energy. Keep lyrics simple and repeatable.

### 4. The Drop Must Pay Off
The drop is where the dancefloor connects. Reduce elements in the build to create tension. Hit with kick + bass synergy.

### 5. Respect the Mix
House music is built for clubs. The mix must translate from monitors to festival PAs. -7 LUFS integrated, -1 dBTP.
`},
{id:'ethics-ai-music',title:'Ethics & AI in Music — 2026 Reality',shortTitle:'Ethics & AI in Music',content:`# Ethics & AI in Music — 2026 Reality

The legal and ethical landscape for AI-assisted music production as it stands now. Not predictions — current reality.

---

## Copyright: The Core Rules

| Scenario | Copyright Status | Action Required |
|----------|-----------------|-----------------|
| 100% AI-generated (no human input beyond prompt) | Public domain — no ownership | Cannot register, cannot enforce |
| AI-assisted with significant human authorship | Copyrightable | Document human contributions |
| AI-generated stems re-recorded by human | Full copyright | Keep session files as proof |
| Cover of existing song via Suno Covers Mode | Requires mechanical license | License BEFORE release |
| Voice clone of a real artist without consent | Illegal in most jurisdictions | Do not release commercially |
| Original AI vocals (not cloning a real person) | Copyrightable with human arrangement | Document your creative decisions |

**The bright line:** Human authorship = copyright. No human authorship = public domain.

---

## The Pro Workflow: AI as Demo Generator

1. **Generate in Suno** — Use V5.5 to create demos, ideas, and starting points
2. **Extract stems** — Demucs htdemucs_ft for drums/bass, UVR5 MDX23C-InstVoc for vocals
3. **Re-record key elements** — Replace AI melodies, vocals, or bass with human performance
4. **Arrange in DAW** — Structure, transitions, and mixing are your human authorship
5. **Register copyright** — Your re-recorded and arranged version is fully copyrightable

---

## Suno-Specific Rules

| Feature | Legal Consideration |
|---------|-------------------|
| **Covers Mode** | Requires mechanical license for commercial release. Suno does NOT provide this. |
| **Voice Clones (Voices)** | Only use your own voice or voices you have written consent for. |
| **Custom Models** | Models trained on your own music are clean. Models trained on copyrighted material are not. |
| **Allow Remix toggle** | Disable this if you're monetising the track. |
| **My Taste** | Feeding it reference tracks doesn't create a copyright issue — the output is what matters. |

---

## AI Detection

- **SubmitHub** runs an AI detection checker on submissions — flagged tracks get rejected
- **Spotify** and other platforms are developing detection systems
- **Beatport/Traxsource** currently rely on human A&R but are watching the space

**What this means:** Pure Suno output submitted as-is will increasingly get flagged. The hybrid workflow sidesteps detection because the final product contains genuine human performance.

---

## Streaming Platform Mastering

| Platform | Target LUFS | True Peak |
|----------|-------------|-----------|
| Spotify | -14 LUFS | -1 dBTP |
| Apple Music | -16 LUFS | -1 dBTP |
| YouTube | -14 LUFS | -1 dBTP |
| Beatport/Traxsource | -7 to -9 LUFS | -1 dBTP |
| Club/DJ play | -7 LUFS | -1 dBTP |

Master at **-7 LUFS, -1 dBTP** for maximum flexibility.

---

## The Hybrid Producer: AI as Instrument

Your artistry as a hybrid producer includes:
- Prompt engineering (directing the AI output)
- Curation and selection (taste is the filter)
- Arrangement and structure (DAW work)
- Mixing and sound design
- Vocal processing and editing
- Re-recording and layering human performance
- Mastering to professional standard

AI is one tool in your chain — like a synthesiser, a drum machine, or a sampler.

---

## Protecting Your Work

| Method | Purpose |
|--------|---------|
| **Copyright registration** | Legal proof of ownership |
| **Metadata embedding** | Prove authorship chain |
| **Session file archiving** | Prove human authorship |
| **Documentation** | Paper trail — prompts, DAW edits |

---

## What NOT to Do

| Action | Risk |
|--------|------|
| Clone a recognisable artist's voice without consent | Legal action — likeness rights |
| Release pure Suno output claiming full authorship | No copyright protection if challenged |
| Use "in the style of [Artist Name]" in commercial releases | Potential passing-off claims |
| Submit AI-only tracks to SubmitHub/labels | Flagged and rejected |
| Ignore mechanical licensing for covers | Takedown + potential lawsuit |
| Leave "Allow Remix" on when monetising | Anyone can legally remix your output |
`},
{id:'release-promotion',title:'Releasing & Promoting AI-Enhanced Tracks',shortTitle:'Release & Promotion',content:`# Releasing & Promoting AI-Enhanced Tracks

Release strategy, legal clearance, distribution, and promotion for AI-assisted house music in 2026.

---

## Release Types

| Type | Best For | Platforms |
|------|----------|----------|
| **Traditional distribution** | Streaming revenue, catalog building | Spotify, Apple Music, Amazon, Tidal, Deezer |
| **Independent DJ-friendly** | Club-driven tracks, edits | Bandcamp, SoundCloud, Beatport, Traxsource |
| **Private DJ promo** | Relationship building, A&R attention | Direct email, WhatsApp groups, promo pools |

---

## Legal Clearance Checklist (V5.5 Updated)

| Check | Pass Criteria |
|-------|---------------|
| **Vocals** | AI-original lyrics, not recreating copyrighted content |
| **Melody** | New composition — not a recognisable recreation |
| **Samples** | No uncleared copyrighted samples in the output |
| **Covers Mode** | If used: mechanical license obtained BEFORE release |
| **Voice clones** | Only your own voice or voices with written consent |
| **Custom Models** | Trained on your own material or licensed content only |
| **Allow Remix** | Disabled in Suno if monetising |
| **Human authorship** | Significant human contribution documented |
| **Re-recorded elements** | Key stems re-performed for copyright ownership |

---

## Release Asset Preparation

| Asset | Spec | Notes |
|-------|------|-------|
| **Cover art** | 3000x3000px, RGB, JPG/PNG | Required by all distributors |
| **Master audio** | WAV 44.1kHz/16-bit minimum, -7 LUFS, -1 dBTP | 24-bit preferred |
| **Press description** | 2-3 sentences | Genre, vibe, comparable artists |
| **Social clip** | 15-30 second hook/drop | Vertical 9:16 for Reels/TikTok |
| **Metadata** | BPM, key, genre, mood, ISRC | Embed in WAV + distributor |

---

## Distribution Platforms

| Platform | Strength | Cost |
|----------|----------|------|
| **DistroKid** | Fast, unlimited releases | $22/yr |
| **TuneCore** | Detailed royalty reporting | $10-30/release |
| **Bandcamp** | Direct sales, fan community | Free |
| **Beatport** | Dance music standard | Via distributor |
| **Traxsource** | Underground house/disco curation | Via distributor |

---

## Promotion Plan

### Pre-Release (2-4 weeks before)

| Action | Platform | Format |
|--------|----------|--------|
| Snippet of the drop | Instagram Reels, TikTok | 10-15 sec vertical video |
| "Making of" clip | YouTube Shorts, Instagram | DAW screen recording |
| Submit to Spotify editorial | Spotify for Artists | Minimum 7 days before release |
| Pre-save link | DistroKid/SmartURL | Drive pre-saves for algorithm boost |

### Release Week

| Action | Platform |
|--------|----------|
| Full track announcement | All socials |
| Drop teaser (hook section) | Reels, TikTok, Shorts |
| Send DJ promo packs | Email, WhatsApp, DMs |
| Submit to playlist curators | SubmitHub, PlaylistPush |

### Post-Release (ongoing)

| Action | Platform | Frequency |
|--------|----------|-----------|
| Crowd reaction clips | Reels, TikTok | Per gig |
| Production breakdown | YouTube, Reels | 1 per track |
| Remix challenge / stem giveaway | SoundCloud, Bandcamp | Per release |
| Email newsletter feature | Your list | Per release |

---

## Content Strategy Per Track

Each release should generate:

| Content Type | Quantity | Platform |
|-------------|----------|----------|
| Short-form clips | 10-20 | Instagram, TikTok, YouTube |
| Production breakdown | 1-2 | YouTube, Instagram |
| DJ set featuring the track | 1+ | SoundCloud, YouTube |
| Behind-the-scenes story posts | 5-10 | Instagram Stories |
| Email newsletter mention | 1 | Your mailing list |

---

## Long-Term Catalog Building

| Strategy | Example | Why It Works |
|----------|---------|-------------|
| **Consistent release cadence** | 1 track every 4-6 weeks | Builds algorithmic favour |
| **Series branding** | "Deep House Sunsets" series | Creates a recognisable product line |
| **Subgenre focus** | 70% piano house, 30% exploration | Builds identity without pigeonholing |
| **Seasonal timing** | Summer anthems in April/May | Align with festival season |

---

## AI Disclosure Best Practices

| Context | Recommended Approach |
|---------|---------------------|
| Track credits | "Produced by [Your Name]" — AI tools don't get artist credit |
| Press bio | "Produces with AI-assisted workflow" if asked |
| Label submissions | Honest about process. Frame as hybrid production |
| Sync/licensing | Full disclosure of AI involvement |
| Social content | "Made with Suno + [DAW]" is clean and transparent |

---

## Collaboration Amplifies Reach

| Collaborator Type | What They Bring | What You Offer |
|-------------------|-----------------|----------------|
| Vocalists | Human performance = stronger copyright | Production + distribution |
| Other producers | Audience cross-pollination | Same |
| DJs | Real-world play testing | Exclusive promos |
| YouTubers / TikTok creators | Content reach | Music for their content |
`},
{id:'prompt-master-library',title:'House Prompt Master Library',shortTitle:'Prompt Master Library',content:`# House Prompt Master Library

The complete V5.5-ready prompt database. Every prompt is formatted for direct paste into Suno's Style field. Front-loaded genre + BPM, 4-7 descriptors, no arrangement cues, negative prompts included.

---

# PART 1: Prompt Engineering Rules (V5.5)

## The Formula

\\\`\\\`\\\`
[GENRE + SUB-GENRE] at [BPM] BPM, [ERA/INFLUENCE]. [DRUMS]. [BASS]. [MELODY 2-3 max]. [VOCAL]. [MIX]. [NEGATIVES 2-3 max].
\\\`\\\`\\\`

## Core Rules

| Rule | Detail |
|------|--------|
| **Style field max** | 1,000 characters |
| **Lyrics field max** | 5,000 characters |
| **Descriptor count** | 4-7 descriptors. Under 4 = too vague. Over 7 = conflicting instructions |
| **Front-load** | Genre + BPM first, always |
| **Max genres** | 2 in a fusion. More than 2 = confused output |
| **No arrangement cues** | Never write "long build-up", "explosive drop", "DJ intro/outro" in style field |
| **Negative prompts** | Max 2-3. Use "Exclude:" prefix. Specific > generic |

---

# PART 2: Advanced Techniques

## Hybrid Subgenre Blending

Combine max 2 genres. Put the dominant genre first.

Disco Tech House at 125 BPM, funk bass, sharp tech percussion, filtered disco loops, punchy kick, groovy. Exclude: trance, ambient pads.

[Verse]
Feel the rhythm in my soul tonight

[Instrumental]

[Chorus]

{id:'remaster-vocal-timing',title:'Suno V5.5 Track Remaster/Upgrade Guide',shortTitle:'Remaster & Vocal Timing',content:`# Suno V5.5 Track Remaster/Upgrade Guide

> How to run an existing Suno V4/V5 track through V5.5 to improve audio quality and expressiveness WITHOUT losing the track's identity (melody, structure, vocal character).

---

## TL;DR — The Settings

For a near-identical remaster (same melody, same vocals, better sound):

| Slider | Setting | Why |
|--------|---------|-----|
| Audio Influence | **95-100%** | Forces V5.5 to cling to your upload's melody, groove, vocal timing |
| Weirdness | **5-10%** | Prevents melodic/structural experiments while allowing subtle sonic improvements |
| Style Influence | **60-70%** | Strong enough to enforce your genre aesthetic without becoming rigid |

---

## Two Workflows — Pick One

### Method 1: Upload-Led Cover (RECOMMENDED for max fidelity)

Best for: Preserving everything while upgrading sonics.

**Step-by-step:**

1. **Export your original** as WAV or 320k MP3. Trim silence. Leave 2-3 dB headroom
2. **Start new track in V5.5** → Choose "Upload audio" / Custom Create
3. **Upload your original track** as the reference audio
4. **Set model to V5.5** explicitly in the dropdown
5. **Open Creative Sliders** and set:
   - Audio Influence: **95-100%**
   - Weirdness: **5-10%**
   - Style Influence: **60-70%**
6. **Write a non-creative prompt** — example:
   > "Same melody, same vocal, same arrangement. Higher fidelity, wider stereo image, tighter low end, smoother highs, clean master. Do not change lyrics or tune."
7. **Generate full pass** → A/B against original at matched loudness
8. **Fix drifting sections** in Studio editor:
   - Select only the drifting region
   - Replace Section with Audio Influence 95-100%, Weirdness 0-5%, Style Influence 55-65%
9. **Export stems** for final DAW polish if needed

### Method 2: Built-in Remaster (Quick & simple, less control)

1. Open your track → More Actions (triple-dot menu) → Create → **Remaster**
2. Set Variation Strength to **Subtle** (closest to original)
3. Generates **two versions** — compare both against original
4. Can remaster a remastered version iteratively for more refinement
5. Works with **any Suno version** (confirmed V3.5, V4, V5 → V5.5)

**Limitation:** Remaster only does production-level polish. For true V5.5 sonic upgrade, use Method 1.

---

## V5.5-Specific Features That Help

### Custom Models (Pro/Premier only)
- Train a model on **6+ of your own tracks** that captures your genre tendencies
- Takes 2-5 minutes to create, max 3 models
- Use this as the generation model when doing covers → V5.5 output biased toward YOUR sound

### Voices (Pro/Premier only)
- Register your own singing voice (30s-4min sample)
- Useful if your original track used a Suno default voice you want to replace with your actual voice

### My Taste (All users)
- V5.5 learns your genre tendencies from usage history
- Activate via magic wand icon next to style input

---

## Slider Deep-Dive

### What Each Slider Actually Does

| Slider | Low End | Mid | High End |
|--------|---------|-----|----------|
| **Weirdness** | Safe, conventional, predictable | 50% = "normal" expected output | Chaos — unexpected rhythms, melodies |
| **Style Influence** | Loose — style prompt treated as suggestion | Balanced | Strong — strict adherence. Plateaus above ~80% |
| **Audio Influence** | Textural background only (20-40%) | Moderate reference (50-60%) | Upload leads everything (80-100%) |

### Tested Slider Presets (Community-Verified)

#### For Remastering / Preserving Identity

| Preset Name | Weirdness | Style Influence | Audio Influence | Use Case |
|-------------|-----------|-----------------|-----------------|----------|
| **Near-Identical Remaster** | 5-10% | 60-70% | 95-100% | Same song, better sonics. Max preservation. |
| **Identity Lock** | 20% | 25% | 80% | Structural fidelity. Best preservation in remix tests. |
| **Same Music, New Vocal Flavour** | 5-15% | 60-70% | 80-85% | Lets vocal tone flex slightly. Music stays close. |
| **Same Vocal, Modernised Backing** | 15-25% | 65-80% | 70-80% | Arrangement/mix updated, vocals untouched. |

#### For Transformation (NOT what you want, but for reference)

| Preset Name | Weirdness | Style Influence | Audio Influence | Use Case |
|-------------|-----------|-----------------|-----------------|----------|
| Balanced Upgrade | 30-40% | 60-80% | 40-60% | Noticeable improvement with creative touches |
| Genre Rebuilder | 60% | 90% | 30% | Genre pivot, song structure maintained |
| The Rebirth | 80% | 85% | 15% | Radical reimagining |

---

## Troubleshooting

| Problem | Fix |
|---------|-----|
| Melody drifts in chorus | Raise Audio Influence to 100%, drop Weirdness to 0-3% for that section |
| Vocals sound different | Audio Influence to 100%, Weirdness to 0-5% on vocal sections |
| Mix too vanilla / lost energy | Nudge Style Influence to 70-75%, keep Audio Influence maxed, Weirdness under 10% |
| Audio dominates too much (clone, not upgrade) | Reduce Audio Influence by 5-10% increments |
| Extend sections unstable | Lower Weirdness, use shorter segment extensions |
| Lyric cache issues | Perform dummy edit (add/remove punctuation) to force system refresh |

---

## The Golden Rules

1. **Change one slider at a time** — the three interact non-linearly
2. **Test on 20-30 second sections** before committing to full regeneration
3. **Use Replace Section** for surgical fixes rather than regenerating the whole track
4. **Prompt like a producer**, not a poet — "tight kick-bass, mono-compatible low-end, airy controlled highs" beats "make it sound epic"
5. **Export stems for DAW finishing** — Suno applies an aggressive mastering limiter internally
6. **Covers vs Remaster:** Cover = full re-performance. Remaster = production polish only. For max quality, Cover with maxed Audio Influence gives you the best of both.

---

## Stem Cover (Studio Feature)

For surgical upgrades of individual elements:

1. Open track in Studio
2. Extract stems (drums, bass, vocals, music)
3. **Cover** individual stems to upgrade their sound while retaining melody/rhythm
4. Key distinction: **Cover** always references the ORIGINAL source audio. **Recreate** uses the current version on track.
5. Use this to upgrade just the drums or just the bass without touching vocals

---

## The V5.5 Philosophy Shift

V5.5 positions editing as "the main event" rather than optional polish. The intended workflow is now:

**Generate → Open in Editor/Studio → Extract Stems → Replace Sections → Rebuild → Export for DAW finishing**

This means: generate something usable with the settings above, then shape it iteratively. Don't expect one-shot perfection.
`}
];

const GuidesTab = () => {
  const [activeGuide, setActiveGuide] = useState(0);
  const contentRef = useRef(null);

  useEffect(() => {
    if (contentRef.current) contentRef.current.scrollTop = 0;
  }, [activeGuide]);

  const html = useMemo(() => {
    if (typeof marked !== 'undefined') {
      marked.setOptions({ breaks: true, gfm: true });
      return marked.parse(GUIDES[activeGuide].content);
    }
    return GUIDES[activeGuide].content;
  }, [activeGuide]);

  return (
    <div className="panel-enter flex flex-col md:flex-row gap-4" style={{ minHeight: '70vh' }}>
      {/* Sidebar */}
      <div className="md:w-[260px] flex-shrink-0">
        <div className="border border-slate-200 rounded-lg overflow-hidden">
          <div className="bg-slate-50 px-3 py-2 border-b border-slate-200">
            <p className="text-[11px] font-semibold uppercase tracking-wide text-slate-500">9 Production Guides</p>
          </div>
          <div className="divide-y divide-slate-100">
            {GUIDES.map((g, i) => (
              <button
                key={g.id}
                onClick={() => setActiveGuide(i)}
                className={`w-full text-left px-3 py-2.5 text-xs transition-all ${
                  activeGuide === i
                    ? 'bg-amber-50 text-amber-700 font-semibold border-l-2 border-amber-500'
                    : 'text-slate-600 hover:bg-slate-50 border-l-2 border-transparent'
                }`}
              >
                <span className="text-[10px] text-slate-400 mr-1.5">{String(i + 1).padStart(2, '0')}</span>
                {g.shortTitle}
              </button>
            ))}
          </div>
        </div>
      </div>
      {/* Content */}
      <div ref={contentRef} className="flex-1 border border-slate-200 rounded-lg p-5 overflow-y-auto" style={{ maxHeight: '80vh' }}>
        <div className="guide-content" dangerouslySetInnerHTML={{ __html: html }} />
      </div>
    </div>
  );
};
