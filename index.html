  .guide-content code { background: #f1f5f9; padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.8rem; color: #b45309; font-family: 'SF Mono', Consolas, monospace; }
  .guide-content pre { background: #1e293b; color: #e2e8f0; padding: 1rem; border-radius: 8px; overflow-x: auto; margin: 0.75rem 0; font-size: 0.8rem; line-height: 1.5; }

{cat:'Disco House',n:'Funky Disco Roller',id:7,bpm:'125',w:30,s:75,

{cat:'Disco House',n:'French Filter Disco',id:8,bpm:'124',w:35,s:80,

{cat:'Funky Tech House \u2014 Ibiza',n:'Terrace Groover',id:9,bpm:'126',w:35,s:80,
style:'Funky disco-flavoured tech house at 126 BPM, sunny terrace and beach club energy. Solid four-on-the-floor club kick, tight off-beat hats, chunky percussion loops, claps, rolling sub-heavy bass with funk and swing. Filtered disco chord stabs, funky guitar chops, short synth stabs, occasional risers. Feel-good smiling dancefloor vibe with modern tech-house punch, simple repetitive vocal phrases, clean loud mix with strong low end, no big-room EDM, no rock, no cinematic.',
lyrics:'[Instrumental Intro]\n(kick and percussion, 12 bars, bass enters at bar 8)\n\n[Verse 1]\n(spoken/chant style)\nSunshine on my face\nBass line in the place\nLet the groove take over\n\n[Chorus]\nFeel the heat, feel the heat\nEverybody on their feet\nFeel the heat\n\n[Instrumental]\n(guitar chops and percussion, 8 bars)\n\n[Verse 2]\nHands up in the air\nMusic everywhere\nNothing else could matter\n\n[Chorus]\nFeel the heat, feel the heat\n\n[Breakdown]\n(filtered sweep, tension build)\n\n[Drop]\n(full groove return)\n\n[Outro]\n(kick, hats, percussion only, 12 bars)',

{cat:'Funky Tech House \u2014 Ibiza',n:'Sunset Pool Party',id:10,bpm:'124',w:30,s:70,

{cat:'Funky Tech House \u2014 Ibiza',n:'Peak-Time Ibiza Weapon',id:11,bpm:'128',w:40,s:80,

lyrics:'[Instrumental Intro]\n(kick and toms, 12 bars, bass drops at bar 8)\n\n[Verse 1]\n(chopped vocal samples, repetitive)\nMove your body\nMove your body now\nLet it go\n\n[Drop]\n[Energy: Peak]\n(acid line and bass, full groove)\n\n[Instrumental]\n(percussion breakdown, 8 bars, tribal fills)\n\n[Build]\n(rising tension, filtered sweep)\n\n[Drop]\n(full return, vocal chops)\n\n[Outro]\n(kick and percussion strip, 16 bars)',

{cat:'Funky Tech House \u2014 Ibiza',n:'Balearic Tech Groover',id:12,bpm:'122',w:25,s:70,

lyrics:'[Instrumental Intro]\n(shakers and pad, 8 bars, kick enters)\n\n[Verse 1]\n(airy, reverbed)\nOcean breeze is calling me\nLost inside this melody\n\n[Chorus]\nDrifting, drifting away\nInto the sound, into the day\n\n[Instrumental]\n(guitar melody, 8 bars)\n\n[Verse 2]\nColours fading in the sky\nFeel the music passing by\n\n[Chorus]\nDrifting, drifting away\n\n[Breakdown]\n(pads only, ethereal, building slowly)\n\n[Drop]\n(gentle groove return)\n\n[Outro]\n(pad and shakers, kick fading, 8 bars)',

{cat:'Soulful House',n:'Deep Soulful Anthem',id:13,bpm:'123',w:25,s:75,
style:'Deep soulful house at 123 BPM, classic NYC underground vibe. Warm four-on-the-floor kick, swung hats, organic shaker loops, finger snaps. Deep round sub bass, lush rhodes chords, warm string pads, subtle piano fills. Powerful soulful female vocal with gospel inflections, warm spacious mix with depth and soul, no EDM, no rock, no dark techno.',
lyrics:'[Instrumental Intro]\n(rhodes and kick, 8 bars)\n\n[Verse 1]\nDeep inside I feel the rhythm calling\nThrough the darkness I can see the light\nMusic heals the places that were broken\nEverything is gonna be alright\n\n[Pre-Chorus]\nHold on, hold on\n\n[Chorus]\n[Energy: High]\nI believe, I believe in the power\nI believe, I believe in this hour\nMusic is the answer\nLove is all we need\n\n[Instrumental]\n(rhodes solo, 8 bars)\n\n[Verse 2]\nEvery soul connected on this floor tonight\nLifted by the bass and by the light\n\n[Chorus]\nI believe, I believe in the power\n\n[Bridge]\n(strings and vocal, stripped back, emotional)\n\n[Final Chorus]\n[Energy: Peak]\nI believe, I believe in the power\n\n[Outro]\n(rhodes and kick, fading, 8 bars)',
vars:''},
{cat:'Soulful House',n:'Vocal House Diva Cut',id:14,bpm:'125',w:25,s:80,
style:'Uplifting vocal house at 125 BPM, classic diva house energy. Tight four-on-the-floor kick, crisp hats, claps on the 2 and 4, percussion fills. Pumping bass line with sidechain, bright piano chords, string risers, synth stabs. Powerful female diva vocal with runs and ad-libs, loud polished club mix, no dark elements, no rock, no minimal.',
lyrics:'[Instrumental Intro]\n(kick and strings building, 8 bars)\n\n[Verse 1]\nDon\'t you tell me that the night is over\nI\'ve been waiting for this all my life\nFeel the bass line take me somewhere closer\nTo the place where everything feels right\n\n[Chorus]\n[Energy: Peak]\nI\'m alive, I\'m alive, I\'m alive\nCan you feel me now\nI\'m alive, I\'m alive, I\'m alive\nNever coming down\n\n[Instrumental]\n(piano and strings, 8 bars)\n\n[Verse 2]\nEvery light is flashing to the beat\nEvery heart is pounding on the floor\n\n[Chorus]\nI\'m alive, I\'m alive, I\'m alive\n\n[Breakdown]\n(piano and vocal only, emotional)\n\n[Drop]\n(full energy return)\n\n[Outro]\n(kick and hats, 12 bars)',
vars:''},
{cat:'Soulful House',n:'Soulful Garage Stepper',id:15,bpm:'132',w:30,s:75,

{cat:'Lo-Fi House / Downtempo',n:'Lo-Fi House Tape Jam',id:19,bpm:'118',w:35,s:70,

{cat:'Lo-Fi House / Downtempo',n:'Downtempo Soul Groove',id:20,bpm:'102',w:30,s:70,
style:'Laid-back electronic soul at 102 BPM, strong groove and musicality. Loose but tight drums with swung snares and hi-hats, warm punchy kick, funky live-style bass guitar with slides and syncopation. Smooth electric guitar melodies, jazzy rhodes chords, soft synth pads. Warm cozy slightly lo-fi texture with modern clarity in the low end, head-nod bounce, soulful relaxed vocal, no big pop chorus, no rock bands, no cinematic orchestra.',
lyrics:'[Instrumental Intro]\n(bass guitar and rhodes, 8 bars)\n\n[Verse 1]\n(relaxed, smooth)\nEasy does it on a Sunday morning\nCoffee\'s brewing and the record\'s on\nNothing planned and nothing worth the worry\nJust this feeling carrying me along\n\n[Chorus]\nLet it flow, let it flow\nWherever the groove wants to go\nLet it flow, let it flow\n\n[Instrumental]\n(guitar solo, jazzy, 8 bars)\n\n[Verse 2]\nPages turning and the sun is moving\nGolden light is dancing on the wall\n\n[Chorus]\nLet it flow, let it flow\n\n[Bridge]\n(rhodes and bass only, mellow)\n\n[Outro]\n(instrumental fade, bass and guitar, 8 bars)',
vars:''},
{cat:'Lo-Fi House / Downtempo',n:'Lo-Fi Sunset Chiller',id:21,bpm:'110',w:25,s:65,

lyrics:'[Instrumental Intro]\n(acoustic guitar and snaps, 8 bars)\n\n[Verse 1]\n(breathy, intimate)\nWatching colours melt across the sky\nAnother perfect ending passing by\n\n[Chorus]\nStay a little longer\nStay a little longer with me\n\n[Instrumental]\n(synth chords and guitar, 8 bars)\n\n[Verse 2]\nWind is warm and everything is still\nTime is moving slow upon the hill\n\n[Chorus]\nStay a little longer with me\n\n[Outro]\n(music box and guitar, gentle fade, 8 bars)',

{cat:'Funky / Groovy House',n:'Funky Jackin\' House',id:22,bpm:'126',w:40,s:80,
style:'Funky jackin house at 126 BPM, Chicago-meets-Ibiza energy. Hard punchy four-on-the-floor kick, tight off-beat hats, sharp handclaps, rolling percussion. Thick distorted bass with funk, choppy filtered disco samples, funky clavinet stabs, acid-tinged synth lines. Short chopped vocal hooks and crowd shouts, loud aggressive punchy mix, no melodic breaks, no pop vocals, no rock.',
lyrics:'[Instrumental Intro]\n(kick and claps, 12 bars, bass drops at bar 8)\n\n[Verse 1]\n(chopped, aggressive)\nJack your body\nJack your body to the beat\nMove it\n\n[Drop]\n[Energy: Peak]\n(full funk groove, disco chops)\n\n[Instrumental]\n(clavinet and acid line, 8 bars)\n\n[Chorus]\n(crowd style)\nHey! Hey! Hey!\nJack your body\n\n[Breakdown]\n(percussion strip, building)\n\n[Drop]\n(full return)\n\n[Outro]\n(kick and claps, 16 bars)',

{cat:'Funky / Groovy House',n:'Afro Funk House',id:23,bpm:'122',w:35,s:75,
style:'Afro-influenced funky house at 122 BPM, warm percussive groove. Deep kick, complex polyrhythmic percussion with djembe and shaker patterns, tight hats. Warm bass guitar with Afrobeat swing, marimba melody, kalimba textures, horn stabs. Joyful call-and-response vocal with African-influenced phrasing, warm organic mix with percussive punch, no EDM, no rock, no dark sounds.',
lyrics:'[Instrumental Intro]\n(djembe and percussion, 8 bars, kick enters)\n\n[Verse 1]\n(call and response)\nCan you hear the drum? (hear the drum)\nCan you feel it come? (feel it come)\n\n[Chorus]\nWe are one, we are one\nDancing underneath the sun\nWe are one, we are one\n\n[Instrumental]\n(marimba and horn, 8 bars)\n\n[Verse 2]\nRhythm of the earth is in our feet\nEvery heart is pounding with the beat\n\n[Chorus]\nWe are one, we are one\n\n[Breakdown]\n(percussion only, polyrhythmic, building)\n\n[Drop]\n(full groove return with horns)\n\n[Outro]\n(percussion fading, 8 bars)',
vars:''},
{cat:'Funky / Groovy House',n:'Nu-Disco Funk Roller',id:24,bpm:'118',w:30,s:75,
style:'Nu-disco funk at 118 BPM, sophisticated late-night groove. Tight electronic drums with live feel, crisp hi-hats, snare with room reverb. Groovy synth bass with filter movement, lush string pads, funky rhythm guitar, bright brass section stabs, electric piano fills. Smooth confident male vocal with falsetto hooks, glossy warm mix with wide stereo, no rock, no EDM drops, no dark sounds.',
lyrics:'[Instrumental Intro]\n(rhythm guitar and bass, 8 bars)\n\n[Verse 1]\n(smooth, confident)\nStepping out in velvet and the city glows\nEverybody knows where the music goes\n\n[Pre-Chorus]\nTurn the lights down\n\n[Chorus]\nIt\'s a feeling, it\'s a feeling now\nCan\'t explain it but it\'s all around\nDisco never died it just went underground\n\n[Instrumental]\n(brass stabs and electric piano, 8 bars)\n\n[Verse 2]\nSilver mirrors spinning on the ceiling high\nEvery single moment is a golden high\n\n[Chorus]\nIt\'s a feeling, it\'s a feeling now\n\n[Bridge]\n(strings and bass, smooth breakdown)\n\n[Final Chorus]\nDisco never died it just went underground\n\n[Outro]\n(bass and guitar groove, 8 bars)',
vars:''},
{cat:'Anthemic / Festival',n:'Festival Main Stage Anthem',id:25,bpm:'128',w:20,s:85,
style:'Big-room anthemic house at 128 BPM, festival main stage energy. Massive four-on-the-floor kick, crashing cymbals, stadium claps, heavy snare builds. Huge super-saw synth chords, soaring lead synth melody, epic riser FX, white noise sweeps. Powerful male vocal with stadium-sized reverb, massive loud wide mix, no minimal, no lo-fi, no rock guitars.',
lyrics:'[Instrumental Intro]\n(kick build with riser, 8 bars)\n\n[Verse 1]\nWe came a million miles to be right here\nUnder every star and every light\nNothing in this world could feel this clear\nWe were born to own this night\n\n[Pre-Chorus]\n(build, rising)\nAre you ready? Are you ready?\n\n[Drop]\n[Energy: Peak]\n(massive synth chords, crowd energy)\n\n[Chorus]\nWe own the night, we own the night\nA million hearts are beating as one tonight\nWe own the night\n\n[Breakdown]\n(piano and vocal, emotional, stripped)\n\n[Build]\n(riser, snare roll, building to peak)\n\n[Final Drop]\n[Energy: Peak]\nWe own the night\n\n[Outro]\n(kick and cymbal ride, 12 bars)',
vars:''},
{cat:'Anthemic / Festival',n:'Emotional Melodic House',id:26,bpm:'124',w:25,s:75,
style:'Emotional melodic house at 124 BPM, Afterlife-meets-pop crossover. Clean four-on-the-floor kick, delicate hi-hats, soft claps, atmospheric reverb tails. Deep warm bass, evolving synth arpeggio, lush reverbed pluck melody, ethereal pad layers, subtle piano. Emotional female vocal with vulnerability and power, clean spacious mix with depth and width, no aggressive sounds, no rock, no trap.',
lyrics:'[Instrumental Intro]\n(arpeggio and pad, 8 bars, kick enters)\n\n[Verse 1]\n(vulnerable, intimate)\nI was lost in the silence of my mind\nSearching for a feeling left behind\n\n[Pre-Chorus]\nBut then I heard the sound\n\n[Chorus]\n[Energy: High]\nAnd I\'m coming home, I\'m coming home\nThrough the dark I\'ll find my way alone\nI\'m coming home\n\n[Instrumental]\n(pluck melody, 8 bars)\n\n[Verse 2]\nEvery broken piece is falling into place\nMusic is the light upon my face\n\n[Chorus]\nAnd I\'m coming home, I\'m coming home\n\n[Breakdown]\n(piano and vocal only, deeply emotional)\n\n[Build]\n(arpeggio rising, pad swelling)\n\n[Final Chorus]\n[Energy: Peak]\nI\'m coming home\n\n[Outro]\n(arpeggio and kick, fading, 8 bars)',
vars:''},
{cat:'UK Garage',n:'Classic UK Garage Bumper',id:27,bpm:'130',w:30,s:80,

lyrics:'[Instrumental Intro]\n(2-step beat and bass, 8 bars)\n\n[Verse 1]\n(sweet, R&B delivery)\nBoy you got me feeling some type of way\nEvery time you\'re near me I just want to stay\n\n[Chorus]\nDon\'t let go, don\'t let go\nKeep me close and let the bassline flow\nDon\'t let go\n\n[Instrumental]\n(piano stabs and vocal chops, 8 bars)\n\n[Verse 2]\nSomething in the way you move tonight\nGot me spinning under neon lights\n\n[Chorus]\nDon\'t let go, don\'t let go\n\n[Bridge]\n(strings and vocal, stripped)\n\n[Final Chorus]\nDon\'t let go\n\n[Outro]\n(2-step beat, 8 bars)',

{cat:'Specialty / Crossover',n:'Afro House Spiritual',id:30,bpm:'120',w:35,s:75,
style:'Afro house at 120 BPM, spiritual percussive journey. Deep warm kick, complex shaker and djembe patterns, talking drum fills, subtle ride cymbal. Deep sub bass with minimal movement, ethereal vocal chants, kalimba melody, atmospheric pad drones. Tribal vocal chant with spiritual energy, deep spacious mix with reverb and width, no EDM, no pop, no rock, no bright sounds.',
lyrics:'[Instrumental Intro]\n(shakers and djembe, 12 bars, kick enters slowly)\n\n[Verse 1]\n(chant style, spiritual)\nOooh-ahh, oooh-ahh\nFeel the earth beneath our feet\nOooh-ahh, oooh-ahh\nWhere the rhythm and the spirit meet\n\n[Chorus]\nRise up, rise up\nLet the drum speak through your soul\nRise up, rise up\n\n[Instrumental]\n(kalimba and percussion, 8 bars)\n\n[Chorus]\nRise up, rise up\n\n[Breakdown]\n(pad drone and distant chant, atmospheric)\n\n[Build]\n(percussion intensifying)\n\n[Drop]\n(full percussive groove)\n\n[Outro]\n(shakers and kick, gradual strip, 12 bars)',
vars:''},
{cat:'Soulful House',n:'Late Night Soulful Session',id:31,bpm:'121',w:25,s:75,
style:'Deep soulful house at 121 BPM, late-night NYC underground atmosphere. Warm four-on-the-floor kick, brushed hats with swing, finger snaps, subtle ride. Deep warm sub bass, jazzy rhodes chords with seventh extensions, muted trumpet melody, warm string pad. Intimate smooth male vocal with jazz phrasing, spacious warm mix with depth and soul, no EDM, no rock, no bright commercial sounds.',
lyrics:'[Instrumental Intro]\n(warm rhodes chords, finger snaps, 8 bars)\n\n[Verse 1]\n(intimate, jazz phrasing)\nThe city sleeps but we\'re awake\nDown below where the music plays\nEvery note a breath we take\nLost inside this smoky haze\n\n[Chorus]\nIn the groove tonight\nEverything feels right\nLost in the sound\nWhere my soul is found\n\n[Instrumental]\n(rhodes solo, muted trumpet, 8 bars)\n\n[Verse 2]\nThree AM the world is still\nBut the bass keeps moving through\nEvery chord a gentle thrill\nNothing left to prove\n\n[Chorus]\nIn the groove tonight\nEverything feels right\nLost in the sound\nWhere my soul is found\n\n[Breakdown]\n(strings and finger snaps, minimal)\n\n[Chorus]\nIn the groove tonight\nEverything feels right\n\n[Outro]\n(rhodes and kick, 12 bars, DJ-friendly)',
vars:'Try female vocal for a different vibe. Add "flute melody" for jazz club feel.'},
{cat:'Soulful House',n:'Gospel House Lifter',id:32,bpm:'125',w:20,s:80,
style:'Gospel-infused house at 125 BPM, uplifting Sunday morning energy. Punchy four-on-the-floor kick, handclaps on 2 and 4, tambourine, bright shaker. Warm bass with groove, soaring gospel organ, bright piano chords, lush choir pad layers. Powerful female gospel vocal with runs and ad-libs, warm uplifting mix with energy, no dark elements, no rock, no minimal.',
lyrics:'[Instrumental Intro]\n(organ and tambourine, 8 bars)\n\n[Verse 1]\n[Energy: Building]\nI was searching for the feeling\nSomething deep inside my soul\nThen the music started healing\nMaking every part of me whole\n\n[Chorus]\n[Energy: High]\nLift me up, lift me higher\nFeel the music like a fire\nEvery soul together now\nThis is how we rise\n\n[Breakdown]\n(organ and vocal only, intimate)\nOh lift me\nLift me higher now\n\n[Build]\n(tambourine and claps returning)\n\n[Chorus]\nLift me up, lift me higher\nFeel the music like a fire\nEvery soul together now\nThis is how we rise\n\n[Verse 2]\nEvery voice becomes a choir\nEvery heart begins to sing\nTake us higher, ever higher\nLet the hallelujah ring\n\n[Chorus]\nLift me up, lift me higher\n\n[Outro]\n(organ and kick, 12 bars, DJ-friendly)',
vars:'Add "male baritone counterpoint vocal" for call-and-response. Increase Weirdness to 30% for unexpected chord changes.'},
{cat:'Soulful House',n:'Sunset Soulful Vocal',id:33,bpm:'122',w:25,s:75,
style:'Warm soulful house at 122 BPM, golden hour sunset energy. Soft four-on-the-floor kick, gentle open hats, light shaker, finger snaps. Deep warm bass, acoustic guitar arpeggios, soft synth pads, subtle string arrangement. Emotional soulful female vocal with intimate delivery, warm spacious mix with golden tones, no aggressive sounds, no dark elements, no rock.',
lyrics:'[Instrumental Intro]\n(acoustic guitar and soft kick, 8 bars)\n\n[Verse 1]\n(intimate, emotional)\nColours bleed across the sky\nAmber gold and rose\nTime is standing still tonight\nEverywhere the warm light glows\n\n[Chorus]\nDon\'t let this moment fade\nStay right here with me\nEvery note we play\nIs where I want to be\n\n[Instrumental]\n(guitar arpeggios and strings, 8 bars)\n\n[Verse 2]\nYour silhouette against the light\nThe music soft and low\nI could live inside this night\nNever let it go\n\n[Breakdown]\n(acoustic guitar and vocal only, stripped)\nDon\'t let this moment fade\n\n[Chorus]\nDon\'t let this moment fade\nStay right here with me\nEvery note we play\nIs where I want to be\n\n[Outro]\n(guitar and kick, 12 bars, DJ-friendly)',
vars:'Replace guitar with "warm electric piano" for deeper soul feel.'},
{cat:'Disco House',n:'Studio 54 Revival',id:34,bpm:'122',w:30,s:75,
style:'Classic disco house at 122 BPM, late 70s Studio 54 glamour. Four-on-the-floor kick with disco thump, open hats, handclaps, orchestral percussion hits. Deep funky bass guitar with octave slides, lush disco string section, bright brass stabs, electric piano fills. Powerful diva female vocal with disco phrasing, warm vintage mix with modern low end, no rock, no EDM drops, no dark sounds.',
lyrics:'[Instrumental Intro]\n(strings and kick, disco thump, 8 bars)\n\n[Verse 1]\n(diva delivery, confident)\nDress it up and step inside\nMirror balls are spinning wide\nLeave your troubles at the door\nThis is what you came here for\n\n[Chorus]\n[Energy: High]\nUnder the mirror ball tonight\nEvery star is shining bright\nDance until the morning light\nWe\'re living for tonight\n\n[Instrumental]\n(brass solo, bass guitar groove, 8 bars)\n\n[Verse 2]\nFeel the strings begin to swell\nEvery beat has tales to tell\nGlamour dripping from the walls\nDisco never really falls\n\n[Chorus]\nUnder the mirror ball tonight\nEvery star is shining bright\nDance until the morning light\nWe\'re living for tonight\n\n[Breakdown]\n(strings and claps, building)\n\n[Drop]\n(full disco groove return)\n\n[Outro]\n(kick and bass, 12 bars, DJ-friendly)',
vars:'Add "spoken male DJ announcement" intro for radio feel. Try 124 BPM for modern energy.'},
{cat:'Disco House',n:'Italo Disco House',id:35,bpm:'126',w:30,s:80,
style:'Italo disco house at 126 BPM, 80s synth-driven European energy. Tight electronic drums, punchy kick, crisp snare, bright electronic hats. Pulsing arpeggiated synth bass, lush synth pad chords, bright lead synth melody, vocoder vocal textures. Glossy polished mix with wide stereo synths, euphoric retro-future energy, no guitar, no organic instruments, no dark sounds.',
lyrics:'[Instrumental Intro]\n(arpeggiated synth and kick, 8 bars)\n\n[Verse 1]\n(vocoder texture, glossy)\nNeon signs reflect the rain\nSynthesizers call my name\nCity lights are all I see\nElectric love is calling me\n\n[Chorus]\n(vocoder on chorus)\nElectric dreams tonight\nNeon love and laser light\nDancing through the night\nEverything feels so right\n\n[Instrumental]\n(synth solo, bright lead melody, 8 bars)\n\n[Verse 2]\nPulse is rising, feel the glow\nRetro future stereo\nEvery beat a neon sign\nFlashing through the space and time\n\n[Chorus]\nElectric dreams tonight\nNeon love and laser light\nDancing through the night\nEverything feels so right\n\n[Breakdown]\n(pad chords, atmospheric)\n\n[Build]\n(arpeggio intensifying)\n\n[Drop]\n(full synth groove)\n\n[Outro]\n(kick and synth bass, 8 bars, DJ-friendly)',
vars:'Add "robotic male vocal" for more Italo authenticity. Reduce Style to 70% for more AI creativity.'},
{cat:'Disco House',n:'Disco Funk Workout',id:36,bpm:'124',w:25,s:80,
style:'High-energy disco funk house at 124 BPM, gym-ready party groove. Punchy four-on-the-floor kick, tight hats, sharp claps, cowbell pattern. Slap bass with funk attitude, wah guitar chops, bright brass section hits, clavinet stabs. Energetic confident female vocal with funk delivery, loud punchy mix with bass forward, no ballad moments, no rock, no dark techno.',
lyrics:'[Instrumental Intro]\n(slap bass and cowbell, 8 bars)\n\n[Verse 1]\n(energetic, funk attitude)\nBass is thumping through the floor\nCan\'t sit still I need some more\nEvery muscle wants to move\nLocked into the funky groove\n\n[Chorus]\n[Energy: High]\nGet up, get down, get funky now\nMove your body show me how\nBass is pumping don\'t you stop\nTake it right up to the top\n\n[Instrumental]\n(brass and bass breakdown, wah guitar, 8 bars)\n\n[Verse 2]\nCowbell kicking, hats are tight\nFunk machine is feeling right\nSlap that bass and let it roll\nGroove is taking full control\n\n[Chorus]\nGet up, get down, get funky now\nMove your body show me how\nBass is pumping don\'t you stop\nTake it right up to the top\n\n[Breakdown]\n(claps and vocal only)\nGet funky now\n\n[Drop]\n(full funk groove return)\n\n[Outro]\n(kick and slap bass, 12 bars, DJ-friendly)',
vars:'Add "male vocal shouts and ad-libs" for call-and-response energy.'},
{cat:'Feel-Good House',n:'Summer Anthem',id:37,bpm:'126',w:20,s:80,
style:'Feel-good summer house at 126 BPM, bright festival sunshine energy. Clean four-on-the-floor kick, crisp hats, upbeat claps, shaker loops. Warm punchy bass with sidechain, bright uplifting piano chords, catchy pluck synth melody, warm pad layers. Bright soulful female vocal with joyful delivery, clean polished loud mix, no dark sounds, no rock, no minimal.',
lyrics:'[Instrumental Intro]\n(piano chords and shaker, 8 bars)\n\n[Verse 1]\n(joyful, bright)\nSun is breaking through the clouds\nMusic lifting up the crowds\nEvery window open wide\nGolden feeling deep inside\n\n[Chorus]\n[Energy: High]\nThis is the one we\'ve been waiting for\nOpen every window, every door\nSummer days are here once more\nThis is what we\'re living for\n\n[Breakdown]\n(piano only, emotional, 4 bars)\n\n[Build]\n(pluck synth and risers)\n\n[Drop]\n(full groove, maximum energy)\n\n[Verse 2]\nHands are reaching for the sky\nNot a single reason why\nWe should ever let this end\nDo it all again\n\n[Chorus]\nThis is the one we\'ve been waiting for\nOpen every window, every door\nSummer days are here once more\nThis is what we\'re living for\n\n[Outro]\n(kick and piano, 12 bars, DJ-friendly)',
vars:'Add "male vocal harmony" on chorus for festival crowd feel. Try "steel drum melody" for tropical touch.'},
{cat:'Feel-Good House',n:'Beach Party Banger',id:38,bpm:'125',w:30,s:75,
style:'Tropical feel-good house at 125 BPM, beach party energy. Punchy kick, bright open hats, congas, steel drum melody, shaker loops. Bouncy warm bass, tropical synth chords, marimba hooks, bright pan flute accent. Upbeat energetic vocal with Caribbean-influenced phrasing, warm bright mix with percussion forward, no dark sounds, no rock, no minimal techno.',
lyrics:'[Instrumental Intro]\n(steel drum and congas, 8 bars)\n\n[Verse 1]\n(upbeat, Caribbean energy)\nOcean breeze and sandy feet\nIsland drums a steady beat\nPalm trees swaying side to side\nParadise we\'re living wide\n\n[Chorus]\n[Energy: High]\nParadise is here tonight\nDancing underneath the starlight\nFeel the island rhythm flow\nNever want to let it go\n\n[Instrumental]\n(steel drum solo, marimba hook, 8 bars)\n\n[Verse 2]\nMoonlight shining on the waves\nDancing barefoot, feeling brave\nEvery soul is free tonight\nIsland fire burning bright\n\n[Chorus]\nParadise is here tonight\nDancing underneath the starlight\nFeel the island rhythm flow\nNever want to let it go\n\n[Breakdown]\n(congas and pan flute, stripped)\n\n[Build]\n(percussion building)\n\n[Drop]\n(full tropical groove)\n\n[Outro]\n(steel drum and kick, 8 bars, DJ-friendly)',
vars:'Add "male and female vocal trade-off" for duet energy. Try 123 BPM for more laid-back island feel.'},
{cat:'Feel-Good House',n:'Rooftop Sunset Groove',id:39,bpm:'123',w:25,s:70,
style:'Warm feel-good house at 123 BPM, rooftop golden hour energy. Soft four-on-the-floor kick, gentle hats, finger snaps, subtle bongo. Deep warm bass, muted clean guitar chords, soft synth pad, gentle arpeggio melody. Smooth warm male vocal with relaxed delivery, clean warm mix with golden tone and space, no aggressive drops, no rock, no dark sounds.',
lyrics:'[Instrumental Intro]\n(muted guitar and finger snaps, 8 bars)\n\n[Verse 1]\n(smooth, relaxed)\nSkyline glowing in the west\nUp here feels like we\'re the best\nWarm breeze through the evening air\nNothing else can quite compare\n\n[Chorus]\nUp here above the noise\nEverything is beautiful\nSunset painting gold\nThis is all I need to know\n\n[Instrumental]\n(muted guitar solo, soft pad, 8 bars)\n\n[Verse 2]\nCity hums beneath our feet\nGolden light and gentle heat\nGlass in hand and you right here\nAll I need is crystal clear\n\n[Chorus]\nUp here above the noise\nEverything is beautiful\nSunset painting gold\nThis is all I need to know\n\n[Breakdown]\n(pad and snaps only, atmospheric)\n\n[Chorus]\nUp here above the noise\n\n[Outro]\n(guitar and kick, 12 bars, DJ-friendly)',
vars:'Replace male with "breathy female vocal" for intimate feel. Add "soft trumpet melody" for jazz rooftop vibe.'},
{cat:'Feel-Good House',n:'Festival Sing-Along',id:40,bpm:'128',w:20,s:85,
style:'Big festival feel-good house at 128 BPM, arena-scale crowd energy. Massive four-on-the-floor kick, stadium claps, crashing hats, energetic snare fills. Huge piano chord progression, soaring synth lead, powerful sub bass with sidechain, epic string risers. Powerful male vocal designed for crowd singalong, massive loud wide mix, no minimal, no lo-fi, no rock.',
lyrics:'[Instrumental Intro]\n(piano chords building, 8 bars)\n\n[Verse 1]\n(powerful, anthemic)\nThousands of strangers in one place\nEvery single smiling face\nMusic pulling us as one\nSomething beautiful has begun\n\n[Chorus]\n[Energy: Maximum]\nWe are alive, we are alive\nFeel the sound inside\nWe are alive, we are alive\nTogether tonight\n\n[Breakdown]\n(piano and vocal only, crowd atmosphere)\nWe are alive\nWe are alive\n\n[Build]\n(strings and risers, tension building)\n\n[Drop]\n(massive full groove, maximum energy)\n\n[Verse 2]\nHands are up from front to back\nHeartbeats locked into the track\nThis is everything we need\nOne love, one sound, one creed\n\n[Chorus]\nWe are alive, we are alive\nFeel the sound inside\nWe are alive, we are alive\nTogether tonight\n\n[Outro]\n(kick and claps, 12 bars, DJ-friendly)',
vars:'Add "crowd chant effect" in chorus. Try female vocal for emotional variation.'},
{cat:'Funky / Groovy House',n:'Funk Machine',id:41,bpm:'125',w:30,s:80,
style:'Classic funky house at 125 BPM, proper dancefloor groove. Punchy four-on-the-floor kick, tight off-beat hats, sharp claps, funky percussion loop. Deep funky bass with filter movement, classic house piano chords, filtered disco loop chops, synth stab accents. Short catchy female vocal hook with funk attitude, punchy warm mix with groove, no rock, no dark techno, no ambient.',
lyrics:'[Instrumental Intro]\n(funky bass and hats, 8 bars)\n\n[Verse 1]\n(short, punchy lines)\nBass is deep and hats are tight\nFilter moving left to right\nPiano drops the chord just so\nFunk machine is go\n\n[Chorus]\nCan\'t stop the funk\nCan\'t stop the groove\nEvery single body\'s got to move\nCan\'t stop the funk\n\n[Instrumental]\n(filtered disco chops, piano riff, 8 bars)\n\n[Verse 2]\nDisco loop is chopped and flipped\nEvery snare and hat is clipped\nBass is rolling deep below\nFeel the funky overflow\n\n[Chorus]\nCan\'t stop the funk\nCan\'t stop the groove\nEvery single body\'s got to move\nCan\'t stop the funk\n\n[Breakdown]\n(bass and claps only, filtered)\n\n[Drop]\n(full funky groove return)\n\n[Outro]\n(kick and bass, 12 bars, DJ-friendly)',
vars:'Add "clavinet solo" for extra funk. Try "male vocal chops" instead of female hook.'},
{cat:'Funky / Groovy House',n:'Motown House Fusion',id:42,bpm:'123',w:25,s:75,
style:'Motown-inspired house at 123 BPM, retro soul meets modern club. Four-on-the-floor kick with Motown thump, tambourine on every beat, handclaps, brushed snare. Warm Motown bass guitar with walking groove, vintage electric piano, subtle string section, muted trumpet. Sweet smooth female vocal with 60s soul delivery, warm vintage-toned mix with modern bass clarity, no rock, no EDM, no dark sounds.',
lyrics:'[Instrumental Intro]\n(tambourine and bass guitar, 8 bars)\n\n[Verse 1]\n(sweet, 60s soul delivery)\nThe way you move across the floor\nI\'ve never seen that look before\nEvery step a melody\nDancing like it\'s you and me\n\n[Chorus]\nYou\'ve got that something baby\nThe way you move is crazy\nEvery time the record plays\nI could dance with you for days\n\n[Instrumental]\n(trumpet solo, electric piano, 8 bars)\n\n[Verse 2]\nVintage groove and modern bass\nSmile is lighting up the place\nTambourine on every beat\nMaking everything complete\n\n[Chorus]\nYou\'ve got that something baby\nThe way you move is crazy\nEvery time the record plays\nI could dance with you for days\n\n[Breakdown]\n(strings and vocal, intimate)\n\n[Chorus]\nYou\'ve got that something baby\n\n[Outro]\n(bass guitar and kick, 12 bars, DJ-friendly)',
vars:'Add "male doo-wop backing vocal" for authenticity. Try "hand-played drums feel" for extra warmth.'},
{cat:'Funky / Groovy House',n:'Warehouse Funk',id:43,bpm:'127',w:40,s:80,
style:'Raw warehouse funky house at 127 BPM, underground party energy. Hard punchy kick, metallic hats, aggressive claps, tribal tom fills. Thick distorted bass with gritty filter, raw funk guitar stab, dirty acid synth line, industrial percussion hits. Short aggressive male vocal chops and crowd shouts, raw loud punchy mix with distortion character, no clean pop, no strings, no rock.',
lyrics:'[Instrumental Intro]\n(hard kick and metallic hats, 8 bars)\n\n[Verse 1]\n(aggressive vocal chops)\nIn the warehouse\nFeel the bass\nIn the warehouse\nLose your face\n\n[Drop]\n(distorted bass, acid line, full energy)\n\n[Instrumental]\n(tribal toms and guitar stab, 8 bars)\n\n[Verse 2]\n(crowd shouts)\nEverybody move\nEverybody shake\nEverybody lose control\nLet the warehouse break\n\n[Breakdown]\n(dark percussion, building tension)\n\n[Build]\n(acid synth rising)\n\n[Drop]\n(maximum raw energy, distorted bass)\n\n[Chorus]\nIn the warehouse\nFeel the bass\nIn the warehouse\nLose your face\n\n[Outro]\n(kick and percussion strip, 16 bars, DJ-friendly)',
vars:'Add "303 acid bassline" for more acid house character. Reduce Weirdness to 30% if output is too chaotic.'},
{cat:'Piano House \u2014 Commercial',n:'Euphoric Piano Drop',id:44,bpm:'126',w:20,s:80,
style:'Emotional piano house at 126 BPM, tear-jerker festival moment. Clean four-on-the-floor kick, delicate hats, soft claps, subtle percussion. Warm bass with sidechain, soaring emotional piano melody, lush string arrangement, ethereal pad layers. Powerful emotional female vocal with vulnerability and power, clean wide mix with depth, no dark sounds, no rock, no minimal.',
lyrics:'[Instrumental Intro]\n(piano melody, delicate, 8 bars)\n\n[Verse 1]\n(vulnerable, emotional)\nI was walking through the dark\nSearching for a single spark\nThen a melody appeared\nWashed away my every fear\n\n[Chorus]\n[Energy: High]\nI can feel it in my soul\nEvery broken piece is whole\nWhen the music takes control\nI am finally home\n\n[Breakdown]\n(piano and vocal only, intimate)\nI can feel it in my soul\nEvery broken piece is whole\n\n[Build]\n(strings and risers, emotional tension)\n\n[Drop]\n(massive piano and bass, euphoric)\n\n[Verse 2]\nEvery tear becomes a song\nEvery wound where I belong\nIn the sound I find my light\nEverything will be alright\n\n[Chorus]\nI can feel it in my soul\nEvery broken piece is whole\nWhen the music takes control\nI am finally home\n\n[Outro]\n(piano and kick, 12 bars, DJ-friendly)',
vars:'Add "choir layer" in final chorus for maximum emotion. Try "male vocal with cracking emotion" for alternative.'},
{cat:'Piano House \u2014 Club / 90s',n:'Old School Piano Jam',id:45,bpm:'126',w:35,s:80,
style:'Classic old school piano house at 126 BPM, early 90s rave energy. Hard four-on-the-floor 909 kick, open hats with swing, sharp claps, rolling percussion. Thick warm bass, classic house piano riff looping, organ stabs, acid synth accents, string stab hits. Chopped female vocal samples and rave shouts, loud warm saturated mix with 90s character, no modern pop, no rock, no minimal.',
lyrics:'[Instrumental Intro]\n(909 kick and piano riff, 8 bars)\n\n[Verse 1]\n(chopped vocal samples)\nCan you feel it\nCan you feel the music\nPut your hands up\nIf you feel it\n\n[Drop]\n(classic piano riff, full energy, organ stabs)\n\n[Instrumental]\n(piano riff driving, acid accents, 8 bars)\n\n[Breakdown]\n(string stabs and vocal chops, building)\nCan you feel it\nFeel the music\n\n[Build]\n(rolling percussion, rising)\n\n[Drop]\n(maximum 90s energy, piano riff)\n\n[Verse 2]\n(rave shouts)\nEverybody in the place\nLet me see your hands\nPiano in your face\nThis is how we dance\n\n[Drop]\n(final piano riff section)\n\n[Outro]\n(kick and hats, 16 bars, DJ-friendly)',
vars:'Add "MC shout: are you ready" for rave authenticity. Try 128 BPM for faster rave energy.'},
{cat:'Funky Tech House \u2014 Ibiza',n:'Dark Room Tech Roller',id:46,bpm:'127',w:35,s:85,
style:'Dark driving tech house at 127 BPM, underground club energy. Hard-hitting kick with sub weight, sharp metallic closed hats, industrial clap, dark percussion. Thick distorted rolling bass, dark stab synth chord, filtered noise sweeps, menacing acid line. Dark processed male vocal chops, loud aggressive mix with sub bass weight, no melody, no bright sounds, no rock, no pop.',
lyrics:'[Instrumental Intro]\n(kick and metallic hats, dark, 8 bars)\n\n[Verse 1]\n(dark processed vocal chops)\nDeeper\nDeeper now\nInto the dark\nInto the sound\n\n[Drop]\n(rolling bass and acid line, full weight)\n\n[Instrumental]\n(dark percussion and noise sweeps, 8 bars)\n\n[Breakdown]\n(atmospheric, dark pads, distant vocal)\nDeeper now\nInto the sound\n\n[Build]\n(noise sweep rising, tension)\n\n[Drop]\n(maximum sub bass, acid line, aggressive)\n\n[Verse 2]\n(processed vocal)\nFeel the weight\nFeel the dark\nLet it take you\nDeep\n\n[Drop]\n(final section, relentless groove)\n\n[Outro]\n(kick and hats, 16 bars, DJ-friendly)',
vars:'Add "female whispered vocal" for contrast. Reduce Weirdness to 25% if acid line is too chaotic.'},
{cat:'Funky Tech House \u2014 Ibiza',n:'Groovy Tech Bounce',id:47,bpm:'125',w:25,s:75,
style:'Bouncy groovy tech house at 125 BPM, daytime terrace party energy. Punchy kick, bright off-beat hats, crisp rimshots, funky conga pattern. Bouncy rounded bass with groove, filtered guitar chop, playful synth pluck melody, subtle organ stab. Catchy short female vocal hook with playful delivery, clean punchy mix with bounce, no dark sounds, no rock, no aggressive bass.',
lyrics:'[Instrumental Intro]\n(congas and rimshot, 8 bars)\n\n[Verse 1]\n(playful, light)\nSunshine on the terrace\nMusic in the air\nNothing but good feeling\nEverywhere\n\n[Chorus]\nBounce with me\nBounce with me now\nFeel the rhythm\nFeel it now\n\n[Instrumental]\n(guitar chop and pluck melody, 8 bars)\n\n[Verse 2]\nCongas in the sunshine\nBass is round and warm\nEvery groove is golden\nDancing through the storm\n\n[Chorus]\nBounce with me\nBounce with me now\nFeel the rhythm\nFeel it now\n\n[Breakdown]\n(organ stab and congas, stripped)\n\n[Build]\n(percussion building back)\n\n[Drop]\n(full bouncy groove)\n\n[Outro]\n(kick and congas, 12 bars, DJ-friendly)',
vars:'Add "steel drum accent" for tropical terrace feel. Try "male spoken word intro" for DJ tool character.'},
{cat:'Specialty / Crossover',n:'Reggaeton House Fusion',id:48,bpm:'124',w:30,s:75,
style:'Reggaeton-influenced house at 124 BPM, Latin summer crossover energy. Punchy four-on-the-floor kick with dembow-inspired snare pattern, bright hats, shaker, rim. Tropical bass with rhythmic bounce, reggaeton-style synth chords, Latin guitar pluck, subtle brass accent. Bilingual vocal with Latin energy and house cadence, warm punchy mix with Latin percussion forward, no rock, no dark techno, no minimal.',
lyrics:'[Instrumental Intro]\n(dembow snare and kick, 8 bars)\n\n[Verse 1]\n(bilingual, Latin energy)\nLa noche es joven\nThe night is calling me\nRhythm in my body\nSetting my soul free\n\n[Chorus]\n[Energy: High]\nFuego in the night\nDale, dale, feel it right\nEvery step is fire\nTake it higher\n\n[Instrumental]\n(Latin percussion breakdown, guitar pluck, 8 bars)\n\n[Verse 2]\nBass is moving like a wave\nTropical heat we crave\nEvery beat is fuego\nDale, let the music play though\n\n[Chorus]\nFuego in the night\nDale, dale, feel it right\nEvery step is fire\nTake it higher\n\n[Breakdown]\n(Latin percussion stripped, brass accent)\n\n[Build]\n(dembow pattern returning)\n\n[Drop]\n(full Latin house groove)\n\n[Outro]\n(kick and percussion, 12 bars, DJ-friendly)',
vars:'Add "female reggaeton vocal" for authentic Latin crossover. Try 126 BPM for more house energy.'},
{cat:'Specialty / Crossover',n:'Deep Melodic Journey',id:49,bpm:'120',w:30,s:70,
style:'Progressive deep melodic house at 120 BPM, introspective emotional journey. Soft four-on-the-floor kick, delicate hats, subtle ride cymbal, gentle percussion. Deep warm sub bass, evolving arpeggio synth, lush ethereal pad layers, haunting pluck melody, distant atmospheric textures. No vocals instrumental only, spacious deep mix with reverb and stereo width, no aggressive sounds, no pop, no rock.',
lyrics:'[No Vocals]\n[Instrumental Only]\n\n[Intro]\n(atmospheric pads, distant textures, 8 bars)\n\n[Verse]\n(arpeggio synth enters, building slowly)\n[Energy: Building]\n\n[Build]\n(evolving tension, pluck melody emerging)\n\n[Drop]\n(full melodic payoff, arpeggio and bass together)\n[Energy: High]\n\n[Instrumental]\n(haunting pluck melody, deep bass, 8 bars)\n\n[Breakdown]\n(ethereal pads only, spacious, reverb)\n[Energy: Low]\n\n[Build]\n(arpeggio returning, percussion building)\n\n[Drop]\n(second melodic payoff, maximum depth)\n[Energy: High]\n\n[Outro]\n(stripped atmospheric fade, pads dissolving, 12 bars)',
vars:'Add "distant female vocal ah... pad" for ethereal texture without actual lyrics. Try 122 BPM for slightly more energy.'},
{cat:'Specialty / Crossover',n:'Vocal Chop Tech Weapon',id:50,bpm:'126',w:35,s:80,
style:'Vocal chop driven tech house at 126 BPM, peak-time DJ tool energy. Hard punchy kick, sharp hats, tight clap, rolling percussion fills. Thick rolling bass with sidechain, chopped and pitched vocal sample as main hook, filtered stab synth, subtle acid accent. Processed vocal chops as melodic element not lyrics, loud punchy mix with bass weight, no singing, no pop melody, no rock, no strings.',
lyrics:'[Instrumental Intro]\n(kick and hats, tight, 8 bars)\n\n[Verse]\n(chopped female vocal sample, rhythmic, pitched)\nDa da da\nMm yeah\nOoh\n\n[Drop]\n[Energy: Maximum]\n(vocal chop hook drives the groove, full bass)\n\n[Instrumental]\n(rolling percussion and stab synth, 8 bars)\n\n[Breakdown]\n(stripped percussion, vocal chop echoing in reverb)\nDa da da\nMm yeah\n\n[Build]\n(percussion returning, vocal chops intensifying)\n\n[Drop]\n(second drop, maximum energy, vocal chop hook)\n[Energy: Maximum]\n\n[Instrumental]\n(bass and acid accent, 8 bars)\n\n[Outro]\n(kick and hats, vocal chop fading, 16 bars, DJ-friendly)',
vars:'Add "male vocal chop layer" for stereo width. Reduce Style to 70% for more experimental chop patterns.'},

// === GEMINI TRACK RECREATIONS (51-55) ===
{cat:'Old Skool Rave / Scouse House',n:'Don\'t Go (Rave Edit)',id:51,bpm:'140',w:35,s:85,
style:'Old Skool Rave and Scouse House at 140 BPM, 1992 hardcore energy with donk influences. Heavy four-to-the-floor kick, sharp rhythmic claps, shimmering hi-hats, rolling distorted bassline interacting with kick for pumping effect. Bright rhythmic house piano stabs during vocal sections, rave stab synths, rising uplifter transitions. Pitched-up chipmunk female vocal, urgent and euphoric, 90s rave aesthetic. Relentless frenetic peak-time energy, no chill, no ambient, no rock.',
lyrics:'[Instrumental Intro]\n(kick and basic rhythm, DJ-friendly, 8 bars)\n\n[Build]\n[Energy: Rising]\nHere we go!\nI said!\n\n[Drop]\n[Energy: Maximum]\n(full bassline and rhythmic vocal chops)\nHere we go!\n\n[Chorus]\n[Pitched Female Vocal]\nI cannot bear to see you leave me\nI\'m begging you don\'t go\nDon\'t go\nDon\'t go\n\n[Verse]\nAnd though you tell me that you love me\n[Energy: High]\n\n[Chorus]\nI cannot bear to see you leave me\nI\'m begging you don\'t go\nDon\'t go\n\n[Drop]\n[Energy: Maximum]\nHere we go!\n(bass-heavy loop, peak energy)\n\n[Outro]\n(stripping back to kick and rhythm, 8 bars)',
vars:'Reduce BPM to 135 for slightly less frantic feel. Try "male MC vocal shout" for extra hype layer.'},

{cat:'Soulful House / Gospel House',n:'Sweetest Day of May (Gospel Hymn)',id:52,bpm:'124',w:25,s:75,
style:'Soulful gospel house at 124 BPM, Knee Deep vocal hymn style, warm summer anthem energy. Classic house drums with crisp hi-hats, organic shakers and tambourines. Bright rhythmic house piano chords as melodic centerpiece, groovy funky bassline, muted rhythmic electric guitar stabs, subtle warm synth pads. Powerful soulful male gospel lead vocal with passion and range, multi-layered choir harmonies, improvised vocal ad-libs building emotional peaks. Uplifting spiritual warmth, no dark sounds, no aggressive bass, no electronic.',
lyrics:'[Intro]\n(percussive build, atmospheric synth pads, filtered drums, piano emerging, 16 bars)\n\n[Chorus]\n[Gospel Male Vocal]\nOn the sweetest day of May\nOn the sweetest day\nSweetest day of May\n\n[Verse 1]\nI remember the day you passed my way\nYou took my breath away\nAnd I knew from that moment on\nMy heart would sing this song\n\n[Chorus]\nOn the sweetest day of May\nOn the sweetest day\n\n[Verse 2]\n[Energy: Building]\nI remember the night\nYou held me tight\n[Choir Harmonies]\n\n[Climax]\n[Energy: Maximum]\n[Vocal Ad-libs]\n(choir and lead vocal at full intensity)\nOn the sweetest day\n\n[Outro]\n(extended dub section, piano riffs, vocal echoes, groove focus, 16 bars)',
vars:'Add "female choir response" for call-and-response texture. Try 122 BPM for deeper groove.'},

{cat:'Nu-Disco / Funky House',n:'What Turns You On (Nu-Disco Funk)',id:53,bpm:'126',w:30,s:80,
style:'Nu-Disco and funky house at 126 BPM, infectious groove with disco-inspired loops. Driving four-on-the-floor kick, crisp claps, open hi-hats, bright rhythmic house piano stabs. Heavy funky rolling bassline, synth accent risers for builds. Powerful commanding female vocal sample, soulful house-processed delivery, male hype vocal snippets. Peak-time club energy, glossy production, no rock, no ambient, no dark minimal.',
lyrics:'[Instrumental Intro]\n(kick and clap, DJ-friendly, 8 bars)\n\n[Verse]\n[Powerful Female Vocal]\nI\'m telling you\nI\'m telling you now\n\n[Drop]\n[Energy: High]\n[Male Vocal]\nYeah, we chilling out here with just the funk\nWe got a beat going on\n\n[Chorus]\n[Female Vocal]\nI wanna know what turns you on\nWhat makes you sweat\nWhat makes you dance\nI wanna know what turns you on\n\n[Instrumental]\n(bass and groove, 8 bars)\n\n[Breakdown]\n(piano stabs and vocal hook only, building anticipation)\n[Energy: Building]\n\n[Drop]\n[Energy: Maximum]\n(full elements — piano, vocals, bass together)\nI wanna know what turns you on\n\n[Outro]\n(percussive fade, melodic elements dropping out, 8 bars)',
vars:'Add "filtered disco string loop" for extra warmth. Push to 128 BPM for more peak-time urgency.'},

{cat:'Mainstage / Progressive House',n:'Lift Me Up (Festival Anthem)',id:54,bpm:'128',w:25,s:80,
style:'Mainstage progressive house at 128 BPM, high-energy festival anthem production. Heavy thumping kick drum, sharp claps, crisp hi-hats, driving relentless 4/4 rhythm. Deep pumping bassline with sidechain, bright euphoric synth leads, rising white noise uplifters, warm synth pads. Soulful repeated female vocal hook with echo, rhythmically chopped vocals synced to beat, hypnotic anthemic quality. Peak-time energy, no dark sounds, no minimal, no rock.',
lyrics:'[Instrumental Intro]\n(percussion-led, hi-hats building, filtered vocal tease, 16 bars)\n\n[Build]\n[Energy: Rising]\n[Filtered Female Vocal]\nLift me up\n(synth risers building tension)\n\n[Drop]\n[Energy: Maximum]\n[Female Vocal with Echo]\nLift me up\nLift me up higher\nLift me up, lift me up\nUntil it\'s over\n\n[Instrumental]\n(full beat and bass, synth lead, 8 bars)\n\n[Breakdown]\n(drums drop out, vocal and melodic pads)\n[Energy: Low]\nLift me up higher\n\n[Build]\n[Energy: Rising]\n(white noise uplifter, percussion returning)\n\n[Drop]\n[Energy: Maximum]\nLift me up\nLift me up higher\nLift me up, lift me up\nUntil it\'s over\n\n[Outro]\n(stripping to percussive core, 16 bars, DJ-friendly)',
vars:'Drop to 126 BPM for more groove, less festival. Add "male vocal layer" on final chorus for width.'},

{cat:'Deep House / Tech House',n:'Bad Habit (Deep Groove Remix)',id:55,bpm:'124',w:30,s:75,
style:'Deep house and tech house at 124 BPM, sophisticated rolling groove remix. Tight kick drum, dry claps, very active hi-hat pattern, crisp detailed percussion. Prominent walking rolling bassline as rhythmic engine, deep warm synth stabs, occasional glitchy percussive effects. Soulful smooth female lead vocal with subtle background harmonies and vocal ad-libs. Steady constant-flow energy, hypnotic dancefloor vibe, no aggressive drops, no pop, no rock.',
lyrics:'[Instrumental Intro]\n(clean drum loop, kick and hats, sub-bass entering, 8 bars)\n\n[Verse]\n[Soulful Female Vocal]\n(short vocal snippets teased over beat)\n\n[Chorus]\n[Energy: High]\nI\'m looking for a bad habit\nBoy you drive me mad, mad, mad\nI\'m looking for a bad habit\n\n[Instrumental]\n(rolling bassline, driving hats, vocal loops, 8 bars)\n[Energy: Groovy]\n\n[Verse 2]\n[Vocal Ad-libs]\nYou drive me mad\n(harmonies layered)\n\n[Chorus]\nI\'m looking for a bad habit\nBoy you drive me mad, mad, mad\n\n[Breakdown]\n(slight melodic shift, stripped percussion)\n[Energy: Building]\n\n[Reprise]\n[Energy: High]\n(main vocal and groove return)\nBad habit\n\n[Outro]\n(stripping down, kick and hats, 8 bars)',
vars:'Add "acid bass accent" for more tech house edge. Push to 126 BPM for peak-time sets.'},

// === DISCO HOUSE / FUNKY PIANO (56-65) ===
{cat:'Disco House',n:'Disco Piano Rollercoaster',id:56,bpm:'124',w:30,s:80,
style:'Disco house at 124 BPM, late 70s disco meets modern house production. Driving four-on-the-floor kick with tight sidechain, crisp open hi-hats, funky claps on 2 and 4. Big bright grand piano chords driving the groove, filtered disco string loops, thick funky bass guitar, rhythmic wah-wah guitar stabs. Soulful female vocal, warm glossy mix with disco shimmer, no rock, no dark, no minimal.',
lyrics:'[Instrumental Intro]\n(kick and hats, disco string loop filtering in, 8 bars)\n\n[Verse 1]\n[Soulful Female Vocal]\nGet up off that floor\nI know you want it more\nThe music\'s in your soul\nLet the rhythm take control\n\n[Chorus]\n[Energy: High]\n[Piano]\nDance all night, feel alright\nLet the disco light shine bright\nDance all night, hold on tight\n\n[Verse 2]\nFeel the bassline move your feet\nEvery body feels the heat\nHands are reaching for the sky\nOn a natural high\n\n[Chorus]\nDance all night, feel alright\n\n[Breakdown]\n(piano and strings only, building)\n[Energy: Building]\n\n[Drop]\n[Energy: Maximum]\n(full groove returns, bass guitar funking hard)\n\n[Outro]\n(instrumental groove, 8 bars, DJ-friendly)',
vars:'Add "male backing vocal harmonies" for Philly soul width. Swap bass guitar for synth bass for more modern sound.'},

{cat:'Disco House',n:'Studio 54 Piano Heater',id:57,bpm:'126',w:35,s:75,
style:'Disco house at 126 BPM, Studio 54 energy with modern club punch. Pumping kick drum, shimmering open hi-hats, handclaps, tambourine groove. Bright staccato piano riff as main hook, lush disco strings, slap bass guitar, brass stab accents, phaser-swept rhythm guitar. Diva female vocal with attitude, compressed loud mix with warm analogue saturation, no rock, no trap, no ambient.',
lyrics:'[Instrumental Intro]\n(tambourine and hats, piano riff entering, 8 bars)\n\n[Verse 1]\n[Diva Female Vocal]\nI walked into the room and I knew\nEvery eye was on me babe it\'s true\nThe DJ dropped a beat so divine\nI said this night is mine all mine\n\n[Chorus]\n[Energy: High]\n[Brass Stabs]\nGive it to me, give it to me now\nOn the floor, show me how\nGive it to me, don\'t you stop\nTake it right to the top\n\n[Instrumental]\n(piano riff, slap bass, strings, 8 bars)\n\n[Verse 2]\nMirrorball is spinning overhead\nEvery word the music said\nFeel the heat between us grow\nLet your body let it go\n\n[Chorus]\nGive it to me, give it to me now\n\n[Breakdown]\n(strings and piano, stripped back, tension building)\n\n[Drop]\n[Energy: Maximum]\n(full band drops back in, brass blazing)\n\n[Outro]\n(groove riding out, piano and bass, 8 bars)',
vars:'Add "male vocal call-and-response" on chorus. Try "vocoder vocal texture" for late 70s Moroder vibe.'},

{cat:'Disco House',n:'Filtered Funk Piano Jam',id:58,bpm:'124',w:35,s:80,
style:'French filter disco house at 124 BPM, Daft Punk inspired filtered groove. Tight quantized drums, punchy compressed kick, crisp hi-hats, claps. Side-chained filtered disco piano sample looping and sweeping, envelope filter funky bass, phaser-drenched chord stabs, subtle vocoder textures. Glossy compressed mix with strong sidechain pump, euphoric party energy, no rock, no dark, no minimal techno.',
lyrics:'[Instrumental Intro]\n(filtered piano loop building, kick entering, 8 bars)\n\n[Verse 1]\n[Vocoder Vocal]\nFeel the funk inside your bones\nLet the filter set the tone\nEvery note a brand new high\nTouch the sky\n\n[Chorus]\n[Energy: High]\n(filter opening wide, full piano chords)\nFunky music all night long\nPlay my favourite song\nFunky music can\'t go wrong\n\n[Instrumental]\n(piano filter sweep, bass groove, 8 bars)\n\n[Verse 2]\n[Vocoder Vocal]\nClose your eyes and lose your mind\nLeave the world you know behind\nRhythm takes you somewhere new\nJust let it move through you\n\n[Chorus]\nFunky music all night long\n\n[Breakdown]\n(filter closing, piano stripped, tension)\n[Energy: Building]\n\n[Drop]\n[Energy: Maximum]\n(filter wide open, full pump, everything hits)\n\n[Outro]\n(filter slowly closing, groove fading, 8 bars)',
vars:'Add "talk box vocal" for extra funk. Increase Weirdness to 40% for wilder filter modulation.'},

{cat:'Funky House',n:'Gospel Piano Groover',id:59,bpm:'126',w:25,s:75,
style:'Funky gospel house at 126 BPM, church piano meets club groove. Driving house kick, sharp snares, open hi-hats, tambourine and shaker percussion. Expressive grand piano chords with gospel voicings and runs, deep round bass, Hammond organ swells, warm pad underneath. Powerful soulful female gospel vocal with ad-libs and melisma, choir response harmonies. Uplifting spiritual dancefloor energy, no dark, no minimal, no electronic.',
lyrics:'[Instrumental Intro]\n(piano chords and tambourine, building, 8 bars)\n\n[Verse 1]\n[Powerful Gospel Female Vocal]\nI was lost but now I see\nThe music set my spirit free\nEvery chord a prayer I sing\nLet the hallelujah ring\n\n[Chorus]\n[Energy: High]\n[Choir Response]\nTake me higher, lift me up\nPiano playing, can\'t get enough\nTake me higher, fill my cup\nWith the music of love\n\n[Verse 2]\n[Vocal Ad-libs]\nFeel the organ start to swell\nEvery story it can tell\nOn this floor we are as one\nDancing till the morning comes\n\n[Chorus]\n[Choir]\nTake me higher, lift me up\n\n[Breakdown]\n(piano solo, gospel runs, stripped percussion)\n[Energy: Building]\n\n[Drop]\n[Energy: Maximum]\n(full choir and band, organ blazing)\n\n[Outro]\n(piano and choir fading, tambourine, 8 bars)',
vars:'Add "male baritone gospel vocal" for deeper tonal range. Try "Hammond organ solo" in breakdown.'},

{cat:'Funky House',n:'Jackin\' Piano Weapon',id:60,bpm:'128',w:30,s:85,
style:'Jackin funky house at 128 BPM, raw Chicago-influenced groove with piano muscle. Hard punchy kick, shuffled hi-hats with swing, tight claps, driving percussion. Aggressive staccato piano riff repeating as main hook, thick squelchy acid bass, minimal synth stabs. Short chopped female vocal phrases, raw gritty mix with bass weight, peak-time DJ tool energy, no pop, no ambient, no orchestral.',
lyrics:'[Instrumental Intro]\n(kick and shuffled hats, raw, 8 bars)\n\n[Verse]\n[Chopped Female Vocal]\nJack your body\nMove\nJack your body\n\n[Drop]\n[Energy: Maximum]\n(piano riff hits hard, acid bass rolling)\nJack your body to the beat\n\n[Instrumental]\n(piano riff and bass groove, 8 bars)\n\n[Breakdown]\n(stripped to hats and vocal chops)\nMove your body\n[Energy: Building]\n\n[Drop]\n[Energy: Maximum]\n(piano riff returns full force, bass pumping)\nJack your body\nJack your body to the beat\n\n[Instrumental]\n(acid bass solo section, 8 bars)\n\n[Outro]\n(kick and piano riff, stripping down, 8 bars)',
vars:'Drop to 126 BPM for more groove less jackin. Add "male vocal shout" for Chicago warehouse feel.'},

{cat:'Disco House',n:'Balearic Piano Sunset',id:61,bpm:'122',w:25,s:70,
style:'Balearic disco house at 122 BPM, Ibiza sunset terrace energy. Smooth four-on-the-floor kick, soft hi-hats, gentle claps, organic bongo and conga percussion. Warm Rhodes electric piano chords with chorus effect, lush string pads, mellow funky bassline, subtle guitar arpeggios. Breathy ethereal female vocal, spacious reverb-heavy mix with warmth, golden hour mood, no aggressive bass, no dark, no hard.',
lyrics:'[Instrumental Intro]\n(bongos and Rhodes piano, sunset atmosphere, 8 bars)\n\n[Verse 1]\n[Breathy Female Vocal]\nSun is melting into the sea\nThis moment is all we need\nMusic carries on the breeze\nSwaying gently through the trees\n\n[Chorus]\n[Energy: Warm]\nFeel the glow\nLet it flow\nIsland rhythm moving slow\nFeel the glow tonight\n\n[Verse 2]\nStarlight dancing on the waves\nMemories that we will save\nEvery beat a golden thread\nWeaving dreams inside my head\n\n[Chorus]\nFeel the glow\nLet it flow\n\n[Breakdown]\n(strings and Rhodes only, spacious, reverb)\n[Energy: Low]\n\n[Build]\n(bongos returning, bassline entering)\n\n[Final Chorus]\n[Energy: Warm]\nFeel the glow tonight\n\n[Outro]\n(instrumental groove, sunset fade, 12 bars)',
vars:'Add "saxophone solo" in breakdown for full Balearic moment. Try 120 BPM for deeper chill.'},

{cat:'Funky House',n:'Organ-Driven Funk Machine',id:62,bpm:'126',w:30,s:80,
style:'Funky house at 126 BPM, raw organ-driven groove with piano accents. Punchy kick drum, tight snare, crisp open hi-hats with shuffle, handclaps. Driving Hammond organ riff as main hook, bright piano stab accents, deep funky slap bass, rhythmic clavinet. Sassy female vocal with attitude, punchy loud mix with funk grit, no pop, no ambient, no cinematic.',
lyrics:'[Instrumental Intro]\n(kick and hats, organ riff creeping in, 8 bars)\n\n[Verse 1]\n[Sassy Female Vocal]\nYou think you got the moves\nBut you ain\'t got the groove\nStep up to the floor\nShow me something more\n\n[Chorus]\n[Energy: High]\n[Hammond Organ]\nFunk it up, don\'t you stop\nKeep it moving to the top\nFunk it up, let it drop\nThis groove will never stop\n\n[Instrumental]\n(organ riff, slap bass, clavinet, 8 bars)\n\n[Verse 2]\nFeel the rhythm in your chest\nThis beat\'s above the rest\nOrgan playing loud and proud\nMoving every crowd\n\n[Chorus]\nFunk it up, don\'t you stop\n\n[Breakdown]\n(organ solo, stripped drums, building)\n[Energy: Building]\n\n[Drop]\n[Energy: Maximum]\n(full band drops, bass slapping hard)\n\n[Outro]\n(organ riff and kick, riding out, 8 bars)',
vars:'Add "wah guitar rhythm" for extra funk layer. Try "male vocal harmony" on chorus.'},

{cat:'Disco House',n:'Mirror Ball Piano Anthem',id:63,bpm:'125',w:25,s:80,
style:'Anthemic disco house at 125 BPM, mirror ball euphoria meets modern house punch. Driving kick with sidechain, crisp claps, shimmering hi-hats and ride cymbal. Big uplifting grand piano chord progression building through track, lush orchestral disco strings, warm sub bass, rhythmic guitar strums. Soaring female vocal building to emotional climax, wide stereo mix with disco sparkle, no dark, no minimal, no rock.',
lyrics:'[Instrumental Intro]\n(strings swelling, kick entering, piano teased, 8 bars)\n\n[Verse 1]\n[Soaring Female Vocal]\nUnder mirror lights we shine\nEvery heartbeat keeping time\nHold me close and don\'t let go\nFeel the music overflow\n\n[Chorus]\n[Energy: High]\n[Piano + Strings]\nWe belong on the dancefloor tonight\nWhere the stars and the strobes collide\nWe belong where the music feels right\nDancefloor tonight\n\n[Verse 2]\nSeconds turn to golden hours\nLost inside this world of ours\nPiano playing our refrain\nNever let it end again\n\n[Chorus]\nWe belong on the dancefloor tonight\n\n[Breakdown]\n(piano and vocal only, emotional, stripped)\n[Energy: Low]\nDancefloor tonight\n\n[Build]\n[Energy: Rising]\n(strings swelling, kick returning)\n\n[Final Chorus]\n[Energy: Maximum]\nWe belong on the dancefloor tonight\n\n[Outro]\n(piano and strings riding out, 8 bars)',
vars:'Add "male-female duet vocal" for extra emotional range. Try 127 BPM for bigger festival feel.'},

{cat:'Funky House',n:'Afro Piano Funk Workout',id:64,bpm:'126',w:35,s:75,
style:'Afro-influenced funky house at 126 BPM, tribal percussion meets funky piano energy. Driving kick drum, layered African-inspired percussion including djembe, shakers, and cowbell, open hi-hats. Rhythmic staccato piano riff with Afro chord voicings, deep rolling bassline, kalimba melodic accents, warm pad bed. Powerful call-and-response chant vocal with female lead, energetic uplifting tribal dancefloor feel, no pop, no rock, no dark.',
lyrics:'[Instrumental Intro]\n(tribal percussion building, djembe and shakers, 8 bars)\n\n[Verse 1]\n[Powerful Female Vocal]\nHear the drums they call us home\nFeel the rhythm in your bones\nEvery step upon this ground\nSacred music, sacred sound\n\n[Chorus]\n[Energy: High]\n[Call and Response]\nDance! (dance!)\nMove! (move!)\nFeel the groove inside of you\nDance! (dance!)\nMove! (move!)\n\n[Instrumental]\n(piano riff, kalimba, percussion, 8 bars)\n\n[Verse 2]\nFire burning in the beat\nAncient rhythms modern heat\nPiano driving like a prayer\nMusic floating in the air\n\n[Chorus]\nDance! (dance!)\nMove! (move!)\n\n[Breakdown]\n(percussion only, tribal, building intensity)\n[Energy: Building]\n\n[Drop]\n[Energy: Maximum]\n(full piano and bass return, peak energy)\n\n[Outro]\n(percussion and piano, stripping down, 8 bars)',
vars:'Add "male vocal chant layer" for deeper tribal texture. Try 128 BPM for more energy.'},

{cat:'Disco House',n:'Boogie Piano Groover',id:65,bpm:'124',w:30,s:75,
style:'Boogie disco house at 124 BPM, early 80s boogie funk meets modern house production. Tight quantized kick, crisp finger snaps and claps, programmed hi-hats with swing. Funky electric piano riff with chorus and tremolo effects, deep synth bass with portamento slides, rhythmic muted funk guitar, subtle brass section hits. Smooth male vocal with falsetto, warm vintage mix with tape saturation, no rock, no aggressive, no dark.',
lyrics:'[Instrumental Intro]\n(finger snaps and electric piano riff, 8 bars)\n\n[Verse 1]\n[Smooth Male Vocal]\nMidnight hour and the groove is right\nElectric feeling burning bright\nBassline moving side to side\nCan\'t resist this boogie ride\n\n[Chorus]\n[Energy: High]\n[Falsetto]\nBoogie down, boogie down tonight\nPiano got me feeling right\nBoogie down, don\'t stop the sound\nThe funkiest groove in town\n\n[Verse 2]\nFunk guitar is cutting clean\nSmooth operator on the scene\nBrass is punching through the air\nNothing else can quite compare\n\n[Chorus]\nBoogie down, boogie down tonight\n\n[Breakdown]\n(electric piano and bass only, grooving)\n[Energy: Groovy]\n\n[Build]\n(brass entering, percussion building)\n\n[Final Chorus]\n[Energy: Maximum]\nBoogie down tonight\n\n[Outro]\n(electric piano groove, fading, 8 bars)',
vars:'Add "female vocal harmony" on chorus for classic boogie width. Swap electric piano for clavinet for harder funk.'},

// === HIGH ENERGY PIANO DISCO / FUNKY HOUSE ANTHEMS (66-70) ===
{cat:'Disco House',n:'Piano Disco Peak-Time Edit',id:66,bpm:'128',w:20,s:85,
style:'Piano disco house at 128 BPM, simple high-energy peak-time edit. Four-on-the-floor kick drum, open hi-hats, claps on the two and four. Bright uplifting grand piano chords driving the groove, deep round rolling bassline with sidechain, disco string stabs. Soulful powerful female vocal, clean punchy mix, euphoric dancefloor energy, no complexity, no ambient, no rock, no breakdown tricks.',
lyrics:'[Instrumental Intro]\n(kick and hats, piano filtering in, 8 bars)\n\n[Chorus]\n[Soulful Female Vocal]\nFeel it in your body now\nThe piano tells you how\nFeel it in your body now\nDon\'t you ever stop\n\n[Instrumental]\n(piano chords and bassline riding, 8 bars)\n\n[Chorus]\nFeel it in your body now\nThe piano tells you how\nFeel it in your body now\nDon\'t you ever stop\n\n[Breakdown]\n(piano chords only, 4 bars)\n\n[Drop]\n[Energy: Maximum]\n(kick returns, full groove)\n\n[Chorus]\nFeel it in your body now\n\n[Outro]\n(kick and piano, stripping down, 8 bars)',
vars:'Try 126 BPM for slightly deeper feel. Add "handclaps" for extra disco texture.'},

{cat:'Funky House',n:'Funky Piano All Night Long',id:67,bpm:'128',w:20,s:80,
style:'Funky house at 128 BPM, straight-up piano-driven dancefloor anthem. Hard four-on-the-floor kick, crisp claps, open hi-hats, simple shaker loop. Big bold piano chords with gospel voicings, thick warm bassline pumping underneath, no extra synths no effects. Strong soulful male vocal with conviction, loud clean mix, relentless groove energy, no production tricks, no ambient pads, no rock.',

/* ============================================================
   UTILITY: COPY TO CLIPBOARD
   ============================================================ */
function useCopy() {
  const [copied, setCopied] = useState(false);
  const copy = useCallback((text) => {
    navigator.clipboard.writeText(text).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 1200);
    });
  }, []);
  return { copied, copy };
}

const CopyBtn = memo(({ text, className = '' }) => {
  const { copied, copy } = useCopy();
  return (
    <button
      onClick={(e) => { e.stopPropagation(); copy(text); }}
      className={`inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium rounded-md border transition-all duration-150 ${
        copied
          ? 'border-amber-300 bg-amber-50 text-amber-600'
          : 'border-slate-200 bg-white text-slate-500 hover:border-amber-300 hover:text-amber-600'
      } ${className}`}
    >
      {copied ? <><Icon.Check size={13} /> Copied</> : <><Icon.Copy size={13} /> Copy</>}
    </button>
  );
});

/* ============================================================

const PromptBuilder = () => {
  const [fields, setFields] = useState({
    genre: '', bpm: '', drums: '', bass: '', melody: '', vocal: '', mix: '', neg: ''
  });
  const [lyrTags, setLyrTags] = useState([]);

  const prompt = useMemo(() => {
    const parts = Object.values(fields).filter(Boolean);
    return parts.length ? parts.join('. ') + '.' : '';
  }, [fields]);

  const charCount = prompt.length;
  const ccClass = charCount > 1000 ? 'text-red-600 bg-red-50' : charCount > 800 ? 'text-amber-600 bg-amber-50' : 'text-emerald-600 bg-emerald-50';

  const lyricsText = lyrTags.join('\n\n');

  const fieldDefs = [
    { key: 'genre', label: 'Genre + Sub-Genre', ph: 'e.g. funky disco house, piano house, minimal groove' },
    { key: 'bpm', label: 'BPM + Tempo Feel', ph: 'e.g. at 126 BPM, steady four-on-the-floor' },
    { key: 'drums', label: 'Drums & Percussion', ph: 'e.g. punchy four-on-the-floor kick, tight hats, claps' },
    { key: 'bass', label: 'Bass Character', ph: 'e.g. deep sub bass with sidechain, warm round sub' },
    { key: 'melody', label: 'Melodic Elements (2-3 max)', ph: 'e.g. big piano chords, filtered disco strings, rhodes' },
    { key: 'vocal', label: 'Vocal Direction', ph: 'e.g. powerful soulful female vocal, chopped vocal hooks' },
    { key: 'mix', label: 'Mix Character', ph: 'e.g. warm saturated mix, clean punchy loud mix' },
    { key: 'neg', label: 'Negative Exclusions (2-3)', ph: 'e.g. no rock, no trap, no cinematic orchestral' },
  ];

  return (
    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 panel-enter">
      <div>
        <h3 className="text-sm font-semibold text-slate-900 mb-3 flex items-center gap-2">
          Style Prompt <span className="text-[10px] px-2 py-0.5 rounded bg-amber-50 text-amber-600 font-semibold border border-amber-200">1,000 chars max</span>
        </h3>
        <div className="bg-white border border-slate-200 rounded-lg p-4 space-y-3">
          {fieldDefs.map((f) => (
            <div key={f.key}>
              <label className="block text-[10px] font-semibold text-slate-400 uppercase tracking-wide mb-1">{f.label}</label>
              <input
                type="text"
                placeholder={f.ph}
                value={fields[f.key]}
                onChange={(e) => setFields(prev => ({ ...prev, [f.key]: e.target.value }))}
                className="w-full px-3 py-2.5 text-sm border border-slate-200 rounded-md bg-slate-50 text-slate-900 placeholder:text-slate-400 outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-500/20 transition-all duration-150"
              />

          ))}

      </div>
      <div>

        <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 relative min-h-[120px] text-sm whitespace-pre-wrap break-words">
          {prompt ? prompt : <span className="text-slate-400 italic">Fill in fields to build your style prompt...</span>}
          {prompt && <div className="absolute top-2 right-2"><CopyBtn text={prompt} /></div>}
        </div>
        <div className="text-right mt-1.5">
          <span className={`text-[10px] font-semibold tabular-nums px-2 py-0.5 rounded ${ccClass}`}>
            {charCount} / 1,000

        <h3 className="text-sm font-semibold text-slate-900 mt-6 mb-3">Lyrics Skeleton</h3>
        <div className="bg-white border border-slate-200 rounded-lg p-3">
          <div className="flex flex-wrap gap-1.5">

          {lyricsText ? lyricsText : <span className="text-slate-400 italic">Click structure tags above...</span>}
          {lyricsText && <div className="absolute top-2 right-2"><CopyBtn text={lyricsText} /></div>}
        </div>
        <div className="mt-2">
          <button
            onClick={() => setLyrTags([])}

const PromptsLibrary = () => {
  const [search, setSearch] = useState('');
  const [expanded, setExpanded] = useState(null);

  const filtered = useMemo(() => {
    const q = search.toLowerCase();
    if (!q) return P;
    return P.filter(p =>
      p.n.toLowerCase().includes(q) ||
      p.cat.toLowerCase().includes(q) ||
      p.style.toLowerCase().includes(q)
    );
  }, [search]);

  const grouped = useMemo(() => {
    const map = new Map();
    filtered.forEach(p => {
      if (!map.has(p.cat)) map.set(p.cat, []);
      map.get(p.cat).push(p);
    });
    return map;
  }, [filtered]);

  return (
    <div className="panel-enter">
      <div className="relative mb-4">
        <Icon.Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
        <input
          type="text"

/* ============================================================
   TAB 3: SLIDER SIMULATOR
   ============================================================ */
const SliderSim = () => {
  const [weird, setWeird] = useState(30);
  const [style, setStyle] = useState(75);
  const [audio, setAudio] = useState(0);
  const [vcMode, setVcMode] = useState(false);

  const toggleVc = useCallback(() => {
    setVcMode(prev => {
      const next = !prev;
      if (next) { setWeird(0); setStyle(75); setAudio(25); }
      else { setWeird(30); setStyle(75); setAudio(0); }
      return next;
    });
  }, []);

  const getWeirdHint = (w) => {
    if (vcMode) {
      if (w === 0) return { text: 'Voice clone default. Minimal AI creativity -- preserves your vocal identity.', level: 'normal' };
      if (w <= 15) return { text: 'Slight variation. Good for subtle AI interpretation on your voice.', level: 'normal' };
      if (w <= 30) return { text: 'Moderate. AI may alter phrasing. Monitor vocal quality.', level: 'warn' };
      return { text: 'High for voice clone. Risk of distorted vocal output.', level: 'danger' };
    }
    if (w <= 20) return { text: 'Very safe. Clean commercial output. May sound generic.', level: 'normal' };
    if (w <= 35) return { text: 'House sweet spot. Predictable hooks with slight creative variation.', level: 'normal' };
    if (w <= 50) return { text: 'Moderate. Good for disco/funk where you want surprises.', level: 'normal' };
    if (w <= 70) return { text: 'High. Unpredictable results. Use for experimental sections only.', level: 'warn' };
    return { text: 'CHAOS. Will likely sacrifice mix quality and groove consistency.', level: 'danger' };
  };

  const getStyleHint = (s) => {
    if (s <= 55) return { text: 'Loose. Suno takes creative liberty. More AI interpretation.', level: 'normal' };
    if (s <= 75) return { text: 'Balanced. Good prompt adherence with some freedom.', level: 'normal' };
    if (s <= 85) return { text: 'Strong. Strict adherence to your style prompt. Ideal for house.', level: 'normal' };
    return { text: 'Very high. Plateaus above ~85%. May reduce vocal phrasing variation.', level: 'warn' };
  };

  const getAudioHint = (a) => {
    if (vcMode) {
      if (a === 0) return { text: "No upload. Won't use your voice clone.", level: 'normal' };
      if (a <= 25) return { text: 'Voice clone sweet spot (25%). Maximum AI polish on your voice.', level: 'normal' };
      if (a <= 40) return { text: 'Decent but AI polish reduces. 25% is the proven sweet spot.', level: 'warn' };
      if (a <= 60) return { text: 'Upload-heavy. Vocal quality degrades. Reduce for cleaner output.', level: 'warn' };
      return { text: 'TOO HIGH. Raw unprocessed vocal. AI cannot add production polish at this level.', level: 'danger' };
    }
    if (a === 0) return { text: 'No upload. Suno generates from prompt only.', level: 'normal' };
    if (a <= 30) return { text: 'Light reference. Upload acts as texture/suggestion.', level: 'normal' };
    if (a <= 50) return { text: 'Voice clone zone (~25% is sweet spot). Production-ready version of your voice.', level: 'normal' };
    if (a <= 75) return { text: 'Upload-led. Reference drives melody and structure.', level: 'normal' };
    return { text: "THE 100% MYTH. Quality degrades. AI can't add production polish.", level: 'danger' };
  };

  const getInteraction = () => {
    if (vcMode) {
      let msgs = [{ type: 'gold', text: 'Voice Clone Mode. Optimized for vocal identity preservation.' }];
      if (audio > 40) msgs.push({ type: 'warn', text: 'Audio > 40% in clone mode. Reduce to 25% for best AI polish on your voice.' });
      if (weird > 15) msgs.push({ type: 'warn', text: 'Weirdness > 15% with voice clone. May distort your vocal identity.' });
      return msgs;
    }
    let msgs = [];
    if (weird <= 35 && style >= 70) msgs.push({ type: 'green', text: 'Tight & Commercial. Ideal house combo. Predictable hooks, genre-locked.' });
    else if (weird >= 50 && style >= 80) msgs.push({ type: 'red', text: 'TENSION. High Weirdness + High Style = conflicting instructions.' });
    else if (weird >= 40 && style <= 60) msgs.push({ type: 'cyan', text: 'Creative zone. Good for disco/funk where you want happy accidents.' });
    else msgs.push({ type: 'gold', text: 'Balanced. Adjust one slider at a time to dial in.' });
    if (audio > 75) msgs.push({ type: 'warn', text: 'Audio > 75%. Upload overwhelms prompt. Quality drops.' });
    return msgs;
  };

  const wh = getWeirdHint(weird);
  const sh = getStyleHint(style);
  const ah = getAudioHint(audio);
  const ix = getInteraction();

  const hintBorder = (level) => level === 'danger' ? 'border-l-red-500 bg-red-50' : level === 'warn' ? 'border-l-amber-500 bg-amber-50' : 'border-l-amber-400 bg-slate-50';
  const ixColor = (type) => {
    const map = { green: 'bg-emerald-50 border-emerald-200 text-emerald-800', red: 'bg-red-50 border-red-200 text-red-800', cyan: 'bg-cyan-50 border-cyan-200 text-cyan-800', gold: 'bg-amber-50 border-amber-200 text-amber-800', warn: 'bg-amber-50 border-amber-200 text-amber-800' };
    return map[type] || map.gold;
  };

  const SliderControl = ({ label, value, onChange, min = 'Safe', max = 'Chaos', hint }) => (
    <div className="mb-5">
      <div className="flex justify-between items-center mb-1.5">
        <span className="text-xs font-semibold text-slate-700">{label}</span>
        <span className="text-sm font-bold text-amber-600 tabular-nums min-w-[40px] text-right">{value}%</span>
      </div>
      <div className="flex justify-between text-[9px] text-slate-400 uppercase tracking-wide mb-1">
        <span>{min}</span><span>{max}</span>
      </div>
      <input
        type="range"
        min="0" max="100"
        value={value}
        onChange={(e) => onChange(+e.target.value)}
        style={{ background: `linear-gradient(90deg, #d97706 0%, #f59e0b ${value}%, #e2e8f0 ${value}%)` }}
      />
      <div className={`text-xs text-slate-600 mt-1.5 px-2.5 py-2 rounded-md border-l-2 ${hintBorder(hint.level)} transition-all duration-150`}>
        {hint.text}
      </div>
    </div>
  );

  const genreSheet = [
    ['Commercial Piano','20-25%','70-80%'],['90s Piano House','25-35%','75-85%'],['Disco House','30-40%','70-80%'],
    ['Tech House','30-40%','75-85%'],['Soulful House','20-30%','70-80%'],['Minimal House','25-35%','80-85%'],
    ['Lo-Fi House','30-40%','65-75%'],['UK Garage','30-35%','75-85%'],['Afro House','30-40%','70-80%'],
    ['Festival Anthem','15-25%','80-90%'],
  ];
  const bpmRef = [
    ['Lo-Fi / Downtempo','100-118'],['Soulful / Deep','120-124'],['Tech House','124-128'],
    ['Piano / Disco House','124-128'],['Anthemic / Festival','126-130'],['UK Garage / 2-Step','130-134'],
  ];

  return (
    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 panel-enter">
      <div>
        <h3 className="text-sm font-semibold text-slate-900 mb-3">Control Sliders</h3>
        <div className="bg-white border border-slate-200 rounded-lg p-4">
          <div className="flex items-center gap-3 mb-4 p-3 bg-slate-50 rounded-md border border-slate-200">
            <label className="toggle-switch">
              <input type="checkbox" checked={vcMode} onChange={toggleVc} />
              <span className="toggle-slider" />
            </label>
            <span className="text-xs font-semibold text-slate-700">Voice Clone Mode</span>
            <span className={`text-[10px] ml-auto ${vcMode ? 'text-amber-600' : 'text-slate-400'}`}>
              {vcMode ? 'ON -- defaults: W:0, S:75, A:25' : 'Off -- standard prompting'}
            </span>
          </div>
          <SliderControl label="Weirdness" value={weird} onChange={setWeird} min="Safe" max="Chaos" hint={wh} />
          <SliderControl label="Style Influence" value={style} onChange={setStyle} min="Loose" max="Strong" hint={sh} />
          <SliderControl label="Audio Influence" value={audio} onChange={setAudio} min="Ignore Upload" max="Follow Upload" hint={ah} />
        </div>
        <h3 className="text-sm font-semibold text-slate-900 mt-5 mb-3">Interaction Analysis</h3>
        <div className="bg-white border border-slate-200 rounded-lg p-4 space-y-2">
          {ix.map((m, i) => (
            <div key={i} className={`text-xs px-3 py-2.5 rounded-lg border ${ixColor(m.type)}`}>
              <strong>{m.text.split('.')[0]}.</strong>{m.text.includes('.') ? m.text.substring(m.text.indexOf('.') + 1) : ''}
            </div>
          ))}
        </div>
      </div>
      <div>
        <h3 className="text-sm font-semibold text-slate-900 mb-3">House Genre Cheat Sheet</h3>
        <div className="bg-white border border-slate-200 rounded-lg overflow-hidden mb-5">
          <table className="w-full text-xs">
            <thead><tr className="bg-slate-50"><th className="text-left px-3 py-2 text-[10px] font-bold text-amber-600 uppercase tracking-wide">Genre</th><th className="text-left px-3 py-2 text-[10px] font-bold text-amber-600 uppercase tracking-wide">Weird</th><th className="text-left px-3 py-2 text-[10px] font-bold text-amber-600 uppercase tracking-wide">Style</th></tr></thead>
            <tbody>
              {genreSheet.map(([g, w, s], i) => (
                <tr key={g} className={i % 2 === 0 ? '' : 'bg-slate-50/50'}><td className="px-3 py-2 border-t border-slate-100">{g}</td><td className="px-3 py-2 border-t border-slate-100">{w}</td><td className="px-3 py-2 border-t border-slate-100">{s}</td></tr>
              ))}
            </tbody>
          </table>
        </div>
        <h3 className="text-sm font-semibold text-slate-900 mb-3">BPM Reference</h3>
        <div className="bg-white border border-slate-200 rounded-lg overflow-hidden">
          <table className="w-full text-xs">
            <thead><tr className="bg-slate-50"><th className="text-left px-3 py-2 text-[10px] font-bold text-amber-600 uppercase tracking-wide">Genre</th><th className="text-left px-3 py-2 text-[10px] font-bold text-amber-600 uppercase tracking-wide">BPM</th></tr></thead>
            <tbody>
              {bpmRef.map(([g, b], i) => (
                <tr key={g} className={i % 2 === 0 ? '' : 'bg-slate-50/50'}><td className="px-3 py-2 border-t border-slate-100">{g}</td><td className="px-3 py-2 border-t border-slate-100">{b}</td></tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
};

const MetatagsTab = () => {

  const copyTag = useCallback((tag) => {
    navigator.clipboard.writeText(tag);

    setTimeout(() => setFlashedTag(null), 800);
  }, []);

  const q = search.toLowerCase();

  return (
    <div className="panel-enter">
      <div className="relative mb-4">
        <Icon.Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
